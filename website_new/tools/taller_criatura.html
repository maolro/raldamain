<link rel="stylesheet" href="/assets/css/creature_style.css">
<main class="tl-wrap cc-wrap">
  <div class="cc-top">
    <div>
      <h1 class="tl-h1" id="cc-title">Nueva criatura</h1>
      <p class="tl-sub" id="cc-sub">Rellena la información a la izquierda; la ficha se dibuja a la derecha tal como se verá en la web.</p>
    </div>
    <div class="cc-actions">
      <span id="cc-dirty" class="cc-dirty"></span>
      <label class="cc-pub" title="Si está desmarcada, la criatura solo existe en el Taller: no aparece en el Bestiario de la web">
        <input type="checkbox" id="f-pub"> Publicada en la web</label>
      <a class="btn-ghost" href="/taller/bestiario">🐉 Bestiario</a>
      <a class="btn-ghost" id="cc-web" href="#" target="_blank" hidden>↗ Ver en la web</a>
      <a class="btn-ghost" id="cc-sim" href="#" hidden>⚔ Simular contra</a>
      <button class="btn-gold" id="cc-save" type="button">💾 Guardar</button>
    </div>
  </div>

  <div class="cc-grid">
    <section class="cc-left">
      <div class="cc-card">
        <div class="cc-row">
          <label class="cc-f cc-grow">Nombre<input id="f-name" class="inp" placeholder="Sabueso del Abismo"></label>
          <label class="cc-f">ID (archivo)<input id="f-id" class="inp" placeholder="sabueso_abismo"></label>
        </div>
        <div class="cc-row">
          <label class="cc-f">Tipo<input id="f-type" class="inp" list="dl-types" placeholder="Abisal"></label>
          <label class="cc-f">Tamaño<select id="f-size" class="inp">
            <option>Diminuto</option><option>Pequeño</option><option selected>Mediano</option><option>Grande</option>
            <option>Enorme</option><option>Gigante</option><option>Colosal</option></select></label>
          <label class="cc-f cc-num">Nivel<input id="f-level" class="inp" type="number" min="0" max="30"></label>
          <label class="cc-f">Categoría<input id="f-cat" class="inp" list="dl-cats" placeholder="Esbirro Élite II"></label>
        </div>
        <div class="cc-tierline" id="cc-tierline"></div>
        <label class="cc-f">Descripción<textarea id="f-desc" class="inp" rows="2"></textarea></label>
        <div class="cc-row">
          <label class="cc-f cc-grow">Etiquetas (comas)<input id="f-tags" class="inp" placeholder="Abisal, Élite"></label>
          <label class="cc-f">Imagen<input id="f-image" class="inp" placeholder="sabueso_abismo.jpg"></label>
        </div>
        <label class="cc-f">Trasfondo<textarea id="f-lore" class="inp" rows="2"></textarea></label>
      </div>

      <nav class="cc-tabs" role="tablist">
        <button data-tab="base" class="on" type="button">BASE</button>
        <button data-tab="traits" type="button">PASIVAS <span id="n-traits"></span></button>
        <button data-tab="actions" type="button">ACCIONES <span id="n-actions"></span></button>
        <button data-tab="reactions" type="button">REACCIONES <span id="n-reactions"></span></button>
      </nav>

      <div class="cc-card" id="tab-base">
        <div class="cc-row">
          <label class="cc-f cc-num">Impactos<input id="f-hits" class="inp" type="number" min="1"></label>
          <label class="cc-f cc-num">Acciones<input id="f-acc" class="inp" type="number" min="0"></label>
          <label class="cc-f cc-num">Reacciones<input id="f-rea" class="inp" type="number" min="0"></label>
        </div>
        <div class="cc-sub">Tiros de salvación <span class="muted" style="font-weight:400">· A / M / B = bonus Alto, Medio o Bajo del Tier (siguen al nivel)</span></div>
        <div class="cc-row">
          <label class="cc-f">FÍS<input id="f-sfis" class="inp" placeholder="+7+1d6"><span class="cc-lvls" data-save="FÍS"><button type="button" data-l="extreme" title="Extremo: Alto + 1d6">E</button><button type="button" data-l="bonus" title="Alto">A</button><button type="button" data-l="mid" title="Medio">M</button><button type="button" data-l="low" title="Bajo">B</button></span></label>
          <label class="cc-f">VOL<input id="f-svol" class="inp" placeholder="+7"><span class="cc-lvls" data-save="VOL"><button type="button" data-l="extreme" title="Extremo: Alto + 1d6">E</button><button type="button" data-l="bonus" title="Alto">A</button><button type="button" data-l="mid" title="Medio">M</button><button type="button" data-l="low" title="Bajo">B</button></span></label>
          <label class="cc-f">MEN<input id="f-smen" class="inp" placeholder="+4"><span class="cc-lvls" data-save="MEN"><button type="button" data-l="extreme" title="Extremo: Alto + 1d6">E</button><button type="button" data-l="bonus" title="Alto">A</button><button type="button" data-l="mid" title="Medio">M</button><button type="button" data-l="low" title="Bajo">B</button></span></label>
        </div>
        <div class="cc-sub">Umbrales de daño
          <span class="cc-quick">añadir: <button type="button" data-umb="General">General</button><button type="button" data-umb="Físico">Físico</button><button type="button" data-umb="Magia">Magia</button></span></div>
        <div id="umb-list" class="cc-umbs"></div>
        <div class="cc-row">
          <label class="cc-f cc-grow">Inmunidades (comas)<input id="f-immune" class="inp" placeholder="Veneno, Miedo, Efectos físicos no mágicos"></label>
        </div>
        <div class="cc-row">
          <label class="cc-f cc-grow">Sentidos<input id="f-senses" class="inp" placeholder="Visión en la oscuridad"></label>
          <label class="cc-f cc-grow">Velocidad<input id="f-speed" class="inp" placeholder="Paso 8"></label>
        </div>
      </div>

      <div class="cc-card" id="tab-list" hidden>
        <div class="cc-listbar">
          <button type="button" class="btn-gold cc-mini" id="btn-pick">＋ Desde la biblioteca</button>
          <button type="button" class="btn-ghost cc-mini" id="btn-blank">＋ En blanco</button>
          <span class="muted cc-hint" id="list-hint"></span>
        </div>
        <div id="entries" class="cc-entries"></div>
      </div>
    </section>

    <aside class="cc-right">
      <div id="preview"></div>
    </aside>
  </div>
</main>

<datalist id="dl-types"></datalist>
<datalist id="dl-cats"></datalist>

<div id="pick" class="cc-modal" hidden>
  <div class="cc-panel">
    <div class="cc-pickbar">
      <b id="pick-title">Biblioteca</b>
      <input id="pick-q" class="inp" placeholder="Buscar…">
      <button type="button" class="btn-ghost" id="pick-close">✕</button>
    </div>
    <div class="cc-pickfilters"><div id="pick-tiers"></div><div id="pick-tags"></div></div>
    <div id="pick-list" class="cc-picklist"></div>
  </div>
</div>

<style>

  border-radius: 4px; padding: 5px 10px; cursor: pointer; }

<script>
// ── Tier tables (same defaults as the creature editor; data/creature_scaling.json overrides) ──
let DAMAGE_TIERS = [
  { min:0,  max:0,  LOW:[1,4,2],   MID:[2,4,2],   HIGH:[3,4,2]   },
  { min:1,  max:3,  LOW:[1,6,4],   MID:[2,6,4],   HIGH:[3,6,4]   },
  { min:4,  max:6,  LOW:[2,6,5],   MID:[3,6,5],   HIGH:[4,6,5]   },
  { min:7,  max:9,  LOW:[2,8,6],   MID:[3,8,6],   HIGH:[4,8,6]   },
  { min:10, max:12, LOW:[3,8,7],   MID:[4,8,7],   HIGH:[5,8,7]   },
  { min:13, max:15, LOW:[3,10,8],  MID:[4,10,8],  HIGH:[5,10,8]  },
  { min:16, max:18, LOW:[4,10,9],  MID:[5,10,9],  HIGH:[6,10,9]  },
  { min:19, max:21, LOW:[4,12,10], MID:[5,12,10], HIGH:[6,12,10] },
];
let BONUS_TABLE = [
  { min:0,  max:0,  bonus:'+4',      mid:'+3',      low:'+1',  dd:'1d4', umbral:2 },
  { min:1,  max:3,  bonus:'+5+1d6',  mid:'+5+1d6',  low:'+5',  dd:'1d6', umbral:2 },
  { min:4,  max:6,  bonus:'+7+2d6',  mid:'+7+1d6',  low:'+7',  dd:'2d6', umbral:4 },
  { min:7,  max:9,  bonus:'+9+2d6',  mid:'+9+1d6',  low:'+9',  dd:'3d8', umbral:8 },
  { min:10, max:12, bonus:'+11+3d6', mid:'+11+2d6', low:'+11', dd:'4d8', umbral:12 },
  { min:13, max:15, bonus:'+13+3d6', mid:'+13+2d6', low:'+13', dd:'5d10', umbral:16 },
  { min:16, max:18, bonus:'+15+4d6', mid:'+15+3d6', low:'+15', dd:'6d10', umbral:20 },
  { min:19, max:21, bonus:'+17+4d6', mid:'+17+3d6', low:'+17', dd:'7d12', umbral:24 },
];
const DEFAULT_BONUS = JSON.parse(JSON.stringify(BONUS_TABLE));
const DEFAULT_DAMAGE = JSON.parse(JSON.stringify(DAMAGE_TIERS));
const PHYSICAL = ['contundente', 'cortante', 'perforante'];
const ROMAN = ['I', 'II', 'III', 'IV', 'V', 'VI'];
const normF = s => (s || '').replace(/\s*\+\s*/g, '+').trim();
const fmtDice = s => s ? normF(s).replace(/([a-z0-9])\+/gi, '$1 + ') : s;
const bandOf = (tbl, lv) => tbl.find(b => lv >= b.min && lv <= b.max) || (lv > tbl[tbl.length - 1].max ? tbl[tbl.length - 1] : tbl[0]);
// Tier 0 (level 0) is the first row when the table has it; the rest count from I
const tierOf = lv => DAMAGE_TIERS.indexOf(bandOf(DAMAGE_TIERS, lv)) + (DAMAGE_TIERS[0].min > 0 ? 1 : 0);
// Tables saved before Tier 0 existed get the default Tier 0 row in front
function withTier0(scaling) {
  if (scaling.damage[0] && scaling.damage[0].min > 0) {
    scaling.damage.unshift(JSON.parse(JSON.stringify(DEFAULT_DAMAGE[0])));
    scaling.bonus.unshift({ ...DEFAULT_BONUS[0] });
  }
  return scaling;
}
function scaleDamage(tier, type, lv) {
  const [n, sides, flat] = bandOf(DAMAGE_TIERS, lv)[tier];
  const phys = PHYSICAL.some(p => (type || '').toLowerCase().includes(p));
  const dice = phys ? n : Math.max(0, n - 1);
  const s = dice > 0 ? `${dice}d${sides} + ${flat}` : String(flat);
  return type ? `${s} ${type}` : s;
}

// ── State ──
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
const slug = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase()
  .replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '').slice(0, 60);
const LIST_TYPE = { traits: 'passive', actions: 'action', reactions: 'reaction' };
const LIST_NAME = { traits: 'pasivas', actions: 'acciones', reactions: 'reacciones' };
let C = null, SAVED = '', EXISTING = false, LIB = [], TAB = 'base', ID_TOUCHED = false, SIM_ID = '';
let PICK = { q: '', tag: '', tier: '' };

function blank() {
  return { id: '', name: '', type: '', size: 'Mediano', level: 1, description: '', hits: 2,
    saves: { 'FÍS': '+5', 'VOL': '+5', 'MEN': '+5' }, umbrales: [{ value: 2, categories: 'General', tier_tpl: 'T' }],
    immune: [], senses: '', speed: 'Paso 8', combat: { acciones: 2, reacciones: 1 },
    traits: [], actions: [], reactions: [{ name: 'Parada / Esquiva', desc: '', mod_tpl: { bonus: '+MOD' } }],
    lore: '', tags: [], published: false };
}
const lvOf = () => { const n = parseInt(C.level, 10); return isNaN(n) ? 1 : n; };  // level 0 is valid
function dirty() { return C && JSON.stringify(C) !== SAVED; }

// ── Load ──
async function init() {
  window.updateMetaTags = () => {};  // the site renderer must not retitle this page
  const [, bx] = await Promise.all([loadLibrary(), fetch('/api/bestiario').then(r => r.json())]);
  const uniq = a => [...new Set(a.filter(Boolean))].sort();
  $('dl-types').innerHTML = uniq((bx.creatures || []).map(c => c.type)).map(t => `<option value="${esc(t)}">`).join('');
  $('dl-cats').innerHTML = uniq((bx.creatures || []).map(c => c.category)).map(t => `<option value="${esc(t)}">`).join('');
  const id = new URLSearchParams(location.search).get('c');
  if (id) {
    const r = await fetch('/api/criaturas/' + encodeURIComponent(id), { cache: 'no-store' });
    if (r.ok) {
      C = await r.json(); C.id = id; EXISTING = true;
      const info = (bx.creatures || []).find(x => x.id === id) || {};
      SIM_ID = info.sim_id || id;
      if (typeof C.published !== 'boolean') C.published = !!info.published;  // website creatures already listed stay listed
    }
  }
  if (!C) { C = blank(); rescaleAll(); }
  normalize(C);
  SAVED = JSON.stringify(C);
  fillForm(); renderTab(); loadRenderer();
}
// The library is re-read whenever it may have changed (opening the picker, coming back to this tab),
// so abilities saved in the creature editor's Biblioteca show up without reloading the page
async function loadLibrary() {
  const lib = await fetch('/api/criatura-biblioteca', { cache: 'no-store' }).then(r => r.json());
  LIB = lib.abilities || [];
  if (lib.scaling && Array.isArray(lib.scaling.damage) && Array.isArray(lib.scaling.bonus)) {
    withTier0(lib.scaling);
    DAMAGE_TIERS = lib.scaling.damage;
    BONUS_TABLE = lib.scaling.bonus.map((b, i) => ({ mid: (DEFAULT_BONUS[i] || {}).mid || b.bonus, low: (DEFAULT_BONUS[i] || {}).low || b.bonus, dd: (DEFAULT_BONUS[i] || {}).dd || '',
      umbral: (DEFAULT_BONUS[i] || {}).umbral ?? 0, ...b }));
  }
}
async function refreshLibrary() {
  try { await loadLibrary(); } catch (e) { return; }
  if (!C) return;
  rescaleAll(); headline(); schedulePreview();
  if (!$('pick').hidden) renderPick();
}
window.addEventListener('focus', refreshLibrary);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshLibrary(); });
function normalize(c) {
  c.saves = c.saves || {}; c.combat = c.combat || {}; c.umbrales = c.umbrales || [];
  for (const u of c.umbrales) if (u.tier_scaled) { u.tier_tpl = 'T'; delete u.tier_scaled; }
  for (const k of ['traits', 'actions', 'reactions', 'immune', 'tags']) c[k] = Array.isArray(c[k]) ? c[k] : [];
}

// ── Form <-> data ──
const FIELDS = [
  ['f-name', 'name'], ['f-type', 'type'], ['f-size', 'size'], ['f-cat', 'tier'], ['f-desc', 'description'],
  ['f-image', 'image'], ['f-lore', 'lore'], ['f-senses', 'senses'], ['f-speed', 'speed'],
];
function fillForm() {
  for (const [el, k] of FIELDS) $(el).value = C[k] || '';
  $('f-id').value = C.id || ''; $('f-id').disabled = EXISTING;
  $('f-level').value = lvOf(); $('f-hits').value = C.hits ?? 2;
  $('f-acc').value = C.combat.acciones ?? 2; $('f-rea').value = C.combat.reacciones ?? 1;
  $('f-sfis').value = C.saves['FÍS'] || ''; $('f-svol').value = C.saves['VOL'] || ''; $('f-smen').value = C.saves['MEN'] || '';
  $('f-tags').value = C.tags.join(', '); $('f-immune').value = C.immune.join(', ');
  $('f-pub').checked = !!C.published;
  renderUmbs(); headline(); markSaveLevels();
}
function headline() {
  $('cc-title').textContent = C.name || 'Nueva criatura';
  $('cc-sub').textContent = EXISTING ? `data/creatures/${C.id}.json` : 'Rellena la información a la izquierda; la ficha se dibuja a la derecha tal como se verá en la web.';
  const lv = lvOf();
  const band = bandOf(BONUS_TABLE, lv);
  $('cc-tierline').innerHTML = `Tier <b>${tierOf(lv)}</b> · umbral <b>${esc(band.umbral ?? '')}</b> · bonus Extremo / Alto / Medio / Bajo <b>${esc(bandSave(band, 'extreme'))}</b> / <b>${esc(band.bonus)}</b> / <b>${esc(band.mid || '')}</b> / <b>${esc(band.low || '')}</b>
    · daño LOW / MID / HIGH (físico): ${['LOW', 'MID', 'HIGH'].map(t => `<b>${esc(scaleDamage(t, 'Cortante', lv).replace(' Cortante', ''))}</b>`).join(' / ')} · mágico: un dado menos`;
  $('cc-dirty').textContent = dirty() ? '● sin guardar' : '';
  $('cc-web').hidden = $('cc-sim').hidden = !EXISTING;
  if (EXISTING) { $('cc-web').href = '/criatura/' + encodeURIComponent(C.id); $('cc-sim').href = '/taller/simulador?enemies=' + encodeURIComponent(SIM_ID || C.id); }

// Saves set from the Tier table follow the level; typing one by hand unlinks it
// Extremo is one step beyond Alto: the Alto bonus + 1d6 (merged into its d6s when it has them)
const bandSave = (band, l) => l === 'extreme' ? shiftDice((band.bonus || '').replace(/\s/g, ''), 1).replace(/\s/g, '') : band[l] || '';

// ── Umbrales ──
// An umbral written as T, T+1, T-2… takes the Tier table's umbral that many tiers up or down and follows the level
const UMB_TPL = /^\s*T\s*(?:([+-])\s*(\d+))?\s*$/i;
function tierUmbral(tpl) {
  const m = UMB_TPL.exec(tpl || 'T'); if (!m) return null;
  const j = BONUS_TABLE.indexOf(bandOf(BONUS_TABLE, lvOf())) + diceOff(m[1], m[2]);
  return j < 0 ? 0 : +BONUS_TABLE[Math.min(j, BONUS_TABLE.length - 1)].umbral || 0;
}
function rescaleUmbs() {
  for (const u of C.umbrales) if (u.tier_tpl) u.value = tierUmbral(u.tier_tpl) ?? u.value;
}
const umbHint = u => u.tier_tpl ? `= ${u.value}` : '';
function renderUmbs() {
  $('umb-list').innerHTML = C.umbrales.map((u, i) => `<div class="cc-umb">
      <span class="cc-umb-v"><input class="inp" value="${esc(u.tier_tpl || u.value)}" data-i="${i}" data-k="value" aria-label="Valor"
        title="Un número, o T / T+1 / T-1… para seguir el umbral del Tier"><small class="muted" data-hint="${i}">${umbHint(u)}</small></span>
      <input class="inp" value="${esc(u.categories)}" data-i="${i}" data-k="categories" placeholder="General, Necrótico" aria-label="Tipos">
      <button type="button" class="cc-x" data-del="${i}" title="Quitar">✕</button></div>`).join('')
    || '<span class="muted">Sin umbrales.</span>';
}
$('umb-list').addEventListener('input', e => {
  const i = e.target.dataset.i; if (i == null) return;
  const k = e.target.dataset.k;
  const u = C.umbrales[i], v = e.target.value;
  if (k !== 'value') u[k] = v;
  else if (UMB_TPL.test(v)) { u.tier_tpl = v.replace(/\s/g, '').toUpperCase(); u.value = tierUmbral(u.tier_tpl); }
  else { delete u.tier_tpl; u.value = parseInt(v, 10) || 0; }
  const h = $('umb-list').querySelector(`[data-hint="${i}"]`); if (h) h.textContent = umbHint(u);
  changed();
});
$('umb-list').addEventListener('click', e => {
  if (e.target.dataset.del == null) return;
  C.umbrales.splice(+e.target.dataset.del, 1); renderUmbs(); changed();
});

  C.umbrales.push({ value: 4, categories: b.dataset.umb }); renderUmbs(); changed();
}));

            ['area', 'Área', ''], ['damage', 'Daño', ''], ['save', 'Salvación', ''], ['move', 'Movimiento', ''], ['tags', 'Etiquetas (comas)', 'csv']],

  $('entries').innerHTML = list.map((en, i) => {

// Library entries follow the tier tables while untouched.
// Creature keywords in ability text, resolved for the creature's level:
//   +MOD -> scaled bonus · TIER -> tier number, with arithmetic like the ranks' RANGO
//   ("TIER+2", "TIERx2", "(TIER+1)d6") · LOW / MID / HIGH -> that damage tier's dice
//   (one die fewer when the damage type that follows is a magic one) · DD -> the tier's damage dice
//   MOD, DD and LOW / MID / HIGH take a dice offset written without spaces: "+MOD+1", "DD-1", "HIGH+2"
//   add or remove that many dice ("DD + 4", with spaces, still adds a flat 4)
const KEY_RE = /\+MOD\b|\bMOD[+-]\d+\b|\bTIER\b|\bDD\b|\b(?:LOW|MID|HIGH)\b/;
const KEY_FIELDS = ['name', 'desc', 'bonus', 'damage', 'range', 'area', 'save', 'move'];
const TIER_EXPR = /\(\s*(?:\d+\s*[x×*]\s*)?TIER(?:\s*[+\-x×*/]\s*\d+)*\s*\)|(?:\d+\s*[x×*]\s*)?TIER(?:\s*[+\-x×*/]\s*\d+)*/g;
const MAGIC_WORD = /^(?:fuego|fr[ií]o|el[ée]ctric|[áa]cid|s[óo]nic|radiante|necr[óo]tic|arcan|m[áa]gic|ps[íi]quic|fuerza|veneno|sagrad|sombr)/i;
// Adds n dice to the first NdX of s (removing the term at 0 dice); with no dice, adds n d6
function shiftDice(s, n, minDice = 0) {
  if (!n) return s;
  const m = /(\d+)d(\d+)/i.exec(s);
  if (!m) return n > 0 ? `${s} + ${n}d6` : s;
  const k = Math.max(minDice, +m[1] + n);
  if (k > 0) return s.slice(0, m.index) + `${k}d${m[2]}` + s.slice(m.index + m[0].length);
  const left = s.slice(0, m.index).replace(/\s*\+\s*$/, ''), right = s.slice(m.index + m[0].length);
  return (left ? left + right : right.replace(/^\s*\+\s*/, '')) || '0';
}
const diceOff = (sign, n) => sign ? (sign === '-' ? -n : +n) : 0;
function resolveKeywords(text, mod, tier, damageFor, dd) {
  if (typeof text !== 'string' || !KEY_RE.test(text)) return text;
  let out = text.replace(/(\+)?\bMOD(?:([+-])(\d+))?\b/g, (m, plus, sign, n) =>
    plus || sign ? shiftDice(mod, diceOff(sign, n)) : m);
  if (dd) out = out.replace(/\bDD(?:([+-])(\d+))?\b/g, (m, sign, n) => shiftDice(dd, diceOff(sign, n), 1));  // DD: the tier's damage dice
  out = out.replace(TIER_EXPR, m => {
    const e = m.replace(/TIER/g, tier).replace(/[x×]/g, '*');
    if (!/^[\d+\-*/ ().]+$/.test(e)) return m;
    try { return String(Math.max(0, Math.floor(Function('return (' + e + ')')()))); } catch (err) { return m; }
  });
  return out.replace(/\b(LOW|MID|HIGH)(?:([+-])(\d+))?\b((?:\s+(?:de\s+)?da[ñn]o)?\s+(?:de\s+)?([A-Za-zÁÉÍÓÚáéíóúñ]+))?/g, (m, t, sign, n, rest, word) => {
    const physical = !word || !MAGIC_WORD.test(word);
    return shiftDice(damageFor(t, physical), diceOff(sign, n)) + (rest || '');
  });
}
// The text with keywords is kept in mod_tpl so it follows the level; the saved fields hold the resolved values.
const hasMod = v => typeof v === 'string' && KEY_RE.test(v);
const modText = () => { const b = fmtDice(bandOf(BONUS_TABLE, lvOf()).bonus); return /^[+-]/.test(b) ? b : '+' + b; };
const resolveText = t => {
  const lv = lvOf();
  return resolveKeywords(t, modText(), tierOf(lv), (tier, phys) => scaleDamage(tier, phys ? 'Cortante' : 'Fuego', lv).replace(/ \S+$/, ''),
    bandOf(BONUS_TABLE, lv).dd);
};
function setModField(en, k, v) {
  if (KEY_FIELDS.includes(k) && hasMod(v)) { (en.mod_tpl = en.mod_tpl || {})[k] = v; en[k] = resolveText(v); return; }
  if (en.mod_tpl) { delete en.mod_tpl[k]; if (!Object.keys(en.mod_tpl).length) delete en.mod_tpl; }
  if (v === undefined || (Array.isArray(v) && !v.length)) delete en[k]; else en[k] = v;
}
function scaleEntry(en) {
  const lv = lvOf();
  if (en.damage_tier) en.damage = scaleDamage(en.damage_tier, en.damage_base_type || '', lv);
  if (en.bonus_scaled) en.bonus = fmtDice(bandOf(BONUS_TABLE, lv).bonus);
  for (const [k, t] of Object.entries(en.mod_tpl || {})) en[k] = resolveText(t);
}
function rescaleAll() {
  for (const k of ['actions', 'reactions', 'traits']) C[k].forEach(scaleEntry);
  rescaleSaves(); rescaleUmbs(); renderUmbs();
  $('f-sfis').value = C.saves['FÍS'] || ''; $('f-svol').value = C.saves['VOL'] || ''; $('f-smen').value = C.saves['MEN'] || '';
  if (TAB !== 'base') renderEntries();
}
function insertFromLibrary(ab) {
  const en = JSON.parse(JSON.stringify(ab));
  en.ability_id = ab.id;
  delete en.id; delete en.type; delete en.tier;
  if (typeof en.cost === 'string' && en.cost.trim() !== '' && !isNaN(+en.cost)) en.cost = +en.cost;
  for (const k of Object.keys(en)) if (en[k] === '' || en[k] == null) delete en[k];
  for (const k of KEY_FIELDS) if (hasMod(en[k])) setModField(en, k, en[k]);
  scaleEntry(en);
  C[TAB].push(en);
  renderEntries(); changed();
}

// ── Library picker ──
$('btn-pick').addEventListener('click', () => { PICK = { q: '', tag: '', tier: '' }; $('pick-q').value = ''; $('pick').hidden = false; renderPick(); $('pick-q').focus(); refreshLibrary(); });
$('pick-close').addEventListener('click', () => { $('pick').hidden = true; });
$('pick').addEventListener('click', e => { if (e.target.id === 'pick') $('pick').hidden = true; });
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('pick').hidden = true; });
$('pick-q').addEventListener('input', e => { PICK.q = e.target.value.toLowerCase(); renderPick(); });

  $('pick-list').innerHTML = list.map(a => `<div class="cc-pickitem" data-id="${esc(a.id)}">
      <div class="t"><b>${esc(a.name)}</b>${a.tier ? `<span class="cc-badge gold">T${esc(a.tier)}</span>` : ''}${a.damage_tier ? `<span class="cc-badge ${a.damage_tier}">${a.damage_tier}</span>` : ''}</div>
      <small>${esc([a.cost && `Coste ${a.cost}`, a.damage && `Daño ${a.damage}`, a.save && `Salv. ${a.save}`, (a.tags || []).join(', ')].filter(Boolean).join(' · '))}</small>
      ${a.desc ? `<small>${esc(a.desc.slice(0, 160))}${a.desc.length > 160 ? '…' : ''}</small>` : ''}
    </div>`).join('') || '<p class="muted">No hay habilidades con estos filtros.</p>';
}
$('pick-tiers').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { PICK.tier = b.dataset.tier; renderPick(); } });
$('pick-tags').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { PICK.tag = PICK.tag === b.dataset.tag ? '' : b.dataset.tag; renderPick(); } });

  if (ab) { insertFromLibrary(ab); $('pick').hidden = true; }

// ── Preview: the website's own renderer on a fresh copy of its markup ──
const PRISTINE = `
  <div hidden><h1 id="creature-name"></h1><div id="hero-section"></div><div id="creature-meta"></div>
    <div id="creature-lore"><p id="lore-text"></p></div><div id="creature-loot"><span id="loot-xp-value"></span><table><tbody id="loot-items"></tbody></table></div>
    <div id="creature-tags"></div></div>
  <div class="statblock" id="statblock">

    <div class="statblock-combat" id="statblock-combat"></div>
    <div class="statblock-separator"></div>
    <div class="statblock-abilities" id="statblock-abilities"></div>
    <div class="statblock-separator"></div>

    <div class="statblock-section" id="legendary-section" style="display:none"><h3 class="statblock-section-title">Acciones Legendarias</h3><p class="legendary-intro" id="legendary-intro"></p><div class="statblock-section-content" id="statblock-legendary"></div></div>
  </div>`;
let rendererReady = false, previewTimer = null;
function loadRenderer() {
  // added after load, so its own "load the creature from the URL" start-up never runs
  const s = document.createElement('script');
  s.src = '/assets/js/creature_loader.js?v=' + Date.now();
  s.onload = () => { rendererReady = true; renderPreview(); };
  document.body.appendChild(s);
}
function schedulePreview() { clearTimeout(previewTimer); previewTimer = setTimeout(renderPreview, 120); }
function renderPreview() {
  if (!rendererReady) return;
  const el = $('preview');
  el.innerHTML = PRISTINE;
  const data = JSON.parse(JSON.stringify(C));
  data.name = data.name || 'Nueva criatura';
  try { renderCreaturePage(data); }
  catch (e) { el.innerHTML = `<p class="err">No se pudo dibujar la ficha: ${esc(e.message)}</p>`; }
}

// ── Save ──
$('cc-save').addEventListener('click', save);
document.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); save(); } });
async function save() {
  if (!C.name) { alert('Ponle un nombre a la criatura.'); return; }
  C.id = slug(C.id || C.name);
  if (!C.id) { alert('El ID no es válido.'); return; }
  if (!EXISTING) {
    const r = await fetch('/api/criaturas/' + encodeURIComponent(C.id), { cache: 'no-store' });
    if (r.ok && !confirm(`Ya existe la criatura «${C.id}». ¿Sobrescribirla?`)) return;
  }
  const res = await fetch('/api/criaturas/' + encodeURIComponent(C.id), {
    method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(C) });
  const d = await res.json();
  if (!res.ok) { alert('No se pudo guardar: ' + (d.error || res.status)); return; }
  EXISTING = true; SIM_ID = d.sim_id || C.id; SAVED = JSON.stringify(C);
  history.replaceState(null, '', '?c=' + encodeURIComponent(C.id));
  fillForm(); renderTab(); renderPreview();
  $('cc-dirty').textContent = C.published ? '✓ guardada y publicada' : '✓ guardada (solo en el Taller)';
  setTimeout(() => { if (!dirty()) $('cc-dirty').textContent = ''; }, 2500);
}
window.addEventListener('beforeunload', e => { if (dirty()) { e.preventDefault(); e.returnValue = ''; } });

init();
</script>
