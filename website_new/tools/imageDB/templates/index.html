<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>imageDB</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>imageDB</h1>
    <div class="toolbar">
      <input id="search" type="text" placeholder="Search name, tag, faction, category…" autocomplete="off">
      <select id="filter-category"><option value="">All categories</option></select>
      <select id="filter-faction"><option value="">All factions</option></select>
      <button id="btn-rescan" title="Pick up new files dropped straight into assets/images">Rescan folders</button>
      <button id="btn-select-mode">Select</button>
      <button id="btn-add" class="primary">+ Add images</button>
    </div>
    <div id="tag-bar" class="tag-bar"></div>
    <div id="collection-bar" class="tag-bar collection-bar"></div>
    <div id="collection-header" class="collection-header" hidden></div>
  </header>

  <main id="grid"></main>
  <p id="empty-state" class="empty-state" hidden>No images match. Try clearing the search or rescanning.</p>

  <div id="select-bar" class="select-bar" hidden>
    <span id="select-count">0 selected</span>
    <div class="select-bar-actions">
      <button id="btn-add-to-collection">Add to collection…</button>
      <button id="btn-select-clear">Clear</button>
      <button id="btn-select-done">Done</button>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <div id="modal-backdrop" class="modal-backdrop" hidden>
    <div id="modal" class="modal"></div>
  </div>

  <div id="add-backdrop" class="modal-backdrop" hidden>
    <div class="modal">
      <h2>Add images</h2>
      <div id="dropzone" class="dropzone">
        Drag images here, click to choose files, or paste (Ctrl+V) an image copied from your browser
        <input id="file-input" type="file" accept="image/*" multiple hidden>
      </div>
      <div id="add-list"></div>
      <div class="modal-actions">
        <button id="btn-add-cancel">Cancel</button>
        <button id="btn-add-submit" class="primary">Upload</button>
      </div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
