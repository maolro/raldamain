<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rangos | Raldamain</title>
    <link rel="stylesheet" href="./assets/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <script src="./assets/js/components.js"></script>
    
    <style>
        /* Specific Styles for Filter Buttons */
        .filter-container {
            margin-bottom: 2rem; 
            display: flex; 
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 8px 20px;
            font-size: 0.9rem;
            font-weight: bold;
            border: 1px solid var(--accent-gold);
            cursor: pointer;
            transition: all 0.3s;
            border-radius: 4px;
            background-color: var(--secondary-black); /* Default Dark */
            color: var(--text-main);
        }

        .filter-btn:hover {
            border-color: #fff;
        }

        /* The class used for the selected button */
        .filter-btn.active {
            background-color: var(--accent-gold);
            color: var(--primary-black);
        }
    </style>
</head>
<body>

    <div id="navbar-container"></div>

    <header class="hero" style="height: 40vh; background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('./assets/images/world_map.jpg'); background-size: cover; background-position: center;
    border-bottom: 2px solid var(--accent-gold);">
        <div class="hero-content">
            <h1>Compendio de Rangos</h1>
            <p><b>Explora las disciplinas marciales y mágicas disponibles para tu personaje.</b></p>
        </div>
    </header>

    <section class="container">
        
        <div class="filter-container">
            <button class="filter-btn active" onclick="filterRanks('all', this)">Todos</button>
            <button class="filter-btn" onclick="filterRanks('Ascendencia', this)">Ascendencias</button>
            <button class="filter-btn" onclick="filterRanks('Arcano', this)">Arcanos</button>
            <button class="filter-btn" onclick="filterRanks('Combate', this)">Combate</button>
            <button class="filter-btn" onclick="filterRanks('Elementalismo', this)">Elementalismos</button>
            <button class="filter-btn" onclick="filterRanks('Marcial', this)">Marciales</button>
            <button class="filter-btn" onclick="filterRanks('Ocultismo', this)">Ocultismos</button>
            <button class="filter-btn" onclick="filterRanks('Divino', this)">Divinos</button>
        </div>

        <div class="card-grid" id="ranks-grid">
            <p style="color:white;">Cargando rangos...</p>
        </div>
    </section>

    <footer>
        <p>&copy; 2024 Raldamain Studios.</p>
    </footer>

    <script>
        // Store all data globally so we can filter it later without reloading
        let allRanksData = [];

        document.addEventListener("DOMContentLoaded", () => {
            fetch('./data/ranks_list.json')
                .then(response => response.json())
                .then(ranks => {
                    // 1. SORT ALPHABETICALLY (A-Z)
                    // localeCompare ensures special characters like accents are sorted correctly
                    allRanksData = ranks.sort((a, b) => a.name.localeCompare(b.name));

                    // 2. Initial Render (Show All)
                    renderGrid(allRanksData);
                })
                .catch(error => console.error('Error loading ranks:', error));
        });

        // Function to build the HTML cards
        function renderGrid(ranksToDisplay) {
            const grid = document.getElementById('ranks-grid');
            grid.innerHTML = ''; // Clear current content

            if(ranksToDisplay.length === 0) {
                grid.innerHTML = '<p style="color: #888; font-style: italic;">No se encontraron resultados.</p>';
                return;
            }

            ranksToDisplay.forEach(rank => {
                const cardHTML = `
                    <article class="card">
                        <div class="card-image" style="background-image: url('/assets/images/ranks/${rank.image}'); background-size: cover; height: 150px;"></div>
                        <div class="card-content">
                            <span style="color: #888; font-size: 0.8rem; text-transform: uppercase;">${rank.category}</span>
                            <h3>${rank.name}</h3>
                            <p>${rank.description}</p>
                            
                            <a href="/rango/${rank.id}" class="read-more">Ver Habilidades &rarr;</a>
                        </div>
                    </article>
                `;
                grid.innerHTML += cardHTML;
            });
        }

        // Function called when buttons are clicked
        function filterRanks(category, btnElement) {
            // A. Update Button Visuals (Remove 'active' from all, add to clicked)
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');

            // B. Filter Data
            if (category === 'all') {
                renderGrid(allRanksData);
            } else {
                // Filter the global list based on the category clicked
                const filtered = allRanksData.filter(rank => rank.category === category);
                renderGrid(filtered);
            }
        }
    </script>
</body>
</html>
