<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bestiario | Raldamain</title>
    <link rel="stylesheet" href="./assets/css/style.css">
    <link rel="stylesheet" href="./assets/css/creature_style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <script src="./assets/js/components.js"></script>

    <style>
        /* Filter Buttons - matching rangos.html */
        .filter-container {
            margin-bottom: 1.5rem;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 8px 20px;
            font-size: 0.9rem;
            font-weight: bold;
            border: 1px solid var(--accent-gold);
            cursor: pointer;
            transition: all 0.3s;
            border-radius: 4px;
            background-color: var(--secondary-black);
            color: var(--text-main);
        }

        .filter-btn:hover {
            border-color: #fff;
        }

        .filter-btn.active {
            background-color: var(--accent-gold);
            color: var(--primary-black);
        }

        /* Sort/Level Filter Row */
        .sort-filter-row {
            display: flex;
            gap: 1.5rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .sort-control, .level-control {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sort-control label, .level-control label {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .sort-select, .level-select {
            padding: 8px 12px;
            background: var(--secondary-black);
            border: 1px solid #444;
            border-radius: 4px;
            color: var(--text-main);
            font-size: 0.9rem;
            cursor: pointer;
        }

        .sort-select:focus, .level-select:focus {
            outline: none;
            border-color: var(--accent-gold);
        }
    </style>
</head>
<body>

    <div id="navbar-container"></div>

    <header class="hero bestiary-hero">
        <div class="hero-content">
            <h1>Bestiario</h1>
            <p>Explora las criaturas que habitan en el mundo de Raldamain</p>
        </div>
    </header>

    <section class="container">
        <!-- Collapsible Guide Section
        <div class="guide-section">
            <button class="guide-toggle" id="guide-toggle">
                <span class="guide-toggle-icon">+</span>
                Guía para Crear Criaturas Personalizadas
            </button>
            <div class="guide-content" id="guide-content">
                <p style="color: #888;">Cargando guía...</p>
            </div>
        </div> -->

        <!-- Search Bar -->
        <div class="search-filter-container">
            <input type="text" id="creature-search" placeholder="Buscar criatura por nombre..." class="creature-search-input">
        </div>

        <!-- Filter Buttons -->
        <div class="filter-container">
            <button class="filter-btn active" onclick="filterCreatures('all', this)">Todos</button>
            <button class="filter-btn" onclick="filterCreatures('Humanoide', this)">Humanoides</button>
            <button class="filter-btn" onclick="filterCreatures('Bestia', this)">Bestias</button>
            <button class="filter-btn" onclick="filterCreatures('No-muerto', this)">No-muertos</button>
            <button class="filter-btn" onclick="filterCreatures('Elemental', this)">Elementales</button>
            <button class="filter-btn" onclick="filterCreatures('Dragón', this)">Dragones</button>
            <button class="filter-btn" onclick="filterCreatures('Demonio', this)">Demonios</button>
            <button class="filter-btn" onclick="filterCreatures('Aberración', this)">Aberraciones</button>
            <button class="filter-btn" onclick="filterCreatures('Constructo', this)">Constructos</button>
        </div>

        <!-- Sort and Level Filter -->
        <div class="sort-filter-row">
            <div class="sort-control">
                <label for="sort-select">Ordenar por:</label>
                <select id="sort-select" class="sort-select" onchange="applyFilters()">
                    <option value="name-asc">Nombre (A-Z)</option>
                    <option value="name-desc">Nombre (Z-A)</option>
                    <option value="level-asc">Nivel (menor a mayor)</option>
                    <option value="level-desc">Nivel (mayor a menor)</option>
                </select>
            </div>
            <div class="level-control">
                <label for="level-select">Nivel:</label>
                <select id="level-select" class="level-select" onchange="applyFilters()">
                    <option value="all">Todos los niveles</option>
                    <option value="1-3">Nivel 1-3 (Fácil)</option>
                    <option value="4-6">Nivel 4-6 (Moderado)</option>
                    <option value="7-10">Nivel 7-10 (Difícil)</option>
                    <option value="11-15">Nivel 11-15 (Muy Difícil)</option>
                    <option value="16-20">Nivel 16-20 (Legendario)</option>
                </select>
            </div>
        </div>

        <!-- Creature Grid -->
        <div class="card-grid" id="creatures-grid">
            <p style="color: #888;">Cargando criaturas...</p>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        // Store all data globally for filtering
        let allCreaturesData = [];
        let currentTypeFilter = 'all';

        document.addEventListener("DOMContentLoaded", () => {
            // Load creatures list
            fetch('./data/creatures_list.json')
                .then(response => response.json())
                .then(creatures => {
                    allCreaturesData = creatures;
                    applyFilters();
                })
                .catch(error => {
                    console.error('Error loading creatures:', error);
                    document.getElementById('creatures-grid').innerHTML =
                        '<p style="color: #ff6b6b;">Error al cargar las criaturas.</p>';
                });

            // Load creature creation guide
            fetch('./data/guia_criaturas.md')
                .then(response => response.text())
                .then(text => {
                    document.getElementById('guide-content').innerHTML = marked.parse(text);
                })
                .catch(error => {
                    console.error('Error loading guide:', error);
                    document.getElementById('guide-content').innerHTML =
                        '<p style="color: #888;">Guía no disponible.</p>';
                });

            // Setup guide toggle
            setupGuideToggle();

            // Setup search
            setupSearch();
        });

        function setupGuideToggle() {
            const toggle = document.getElementById('guide-toggle');
            const content = document.getElementById('guide-content');
            const icon = toggle.querySelector('.guide-toggle-icon');

            toggle.addEventListener('click', () => {
                content.classList.toggle('expanded');
                icon.textContent = content.classList.contains('expanded') ? '−' : '+';
            });
        }

        function setupSearch() {
            const searchInput = document.getElementById('creature-search');
            searchInput.addEventListener('input', () => {
                applyFilters();
            });
        }

        function applyFilters() {
            let filtered = [...allCreaturesData];

            // 1. Apply type filter
            if (currentTypeFilter !== 'all') {
                filtered = filtered.filter(c => c.type === currentTypeFilter);
            }

            // 2. Apply search filter
            const searchQuery = document.getElementById('creature-search').value.toLowerCase();
            if (searchQuery) {
                filtered = filtered.filter(c =>
                    c.name.toLowerCase().includes(searchQuery) ||
                    c.type.toLowerCase().includes(searchQuery)
                );
            }

            // 3. Apply level filter
            const levelFilter = document.getElementById('level-select').value;
            if (levelFilter !== 'all') {
                const [minLevel, maxLevel] = levelFilter.split('-').map(Number);
                filtered = filtered.filter(c => c.level >= minLevel && c.level <= maxLevel);
            }

            // 4. Apply sorting
            const sortOption = document.getElementById('sort-select').value;
            switch (sortOption) {
                case 'name-asc':
                    filtered.sort((a, b) => a.name.localeCompare(b.name));
                    break;
                case 'name-desc':
                    filtered.sort((a, b) => b.name.localeCompare(a.name));
                    break;
                case 'level-asc':
                    filtered.sort((a, b) => a.level - b.level);
                    break;
                case 'level-desc':
                    filtered.sort((a, b) => b.level - a.level);
                    break;
            }

            renderGrid(filtered);
        }

        function renderGrid(creaturesToDisplay) {
            const grid = document.getElementById('creatures-grid');
            grid.innerHTML = '';

            if (creaturesToDisplay.length === 0) {
                grid.innerHTML = '<p style="color: #888; font-style: italic; grid-column: 1 / -1; text-align: center;">No se encontraron criaturas.</p>';
                return;
            }

            creaturesToDisplay.forEach(creature => {
                const levelColor = getLevelColor(creature.level);
                const cardHTML = `
                    <article class="card creature-card">
                        <div class="card-image" style="background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.6)), url('/assets/images/creatures/${creature.id}.jpg'); background-size: cover; background-position: center;">
                            <span class="creature-level-badge" style="background-color: ${levelColor};">Nvl ${creature.level}</span>
                        </div>
                        <div class="card-content">
                            <span class="creature-type-label">${creature.type} | ${creature.size}</span>
                            <h3>${creature.name}</h3>
                            <p>${creature.description}</p>
                            <a href="/criatura/${creature.id}" class="read-more">Ver Estadísticas &rarr;</a>
                        </div>
                    </article>
                `;
                grid.innerHTML += cardHTML;
            });
        }

        function getLevelColor(level) {
            if (level <= 3) return '#2d8a4e';      // Green - Low threat
            if (level <= 6) return '#2d6a8a';      // Blue - Moderate
            if (level <= 10) return '#8a6a2d';     // Orange - Dangerous
            if (level <= 15) return '#6a2d8a';     // Purple - Very Dangerous
            return '#8a2d2d';                       // Red - Legendary
        }

        function filterCreatures(type, btnElement) {
            // Update active button
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');

            // Update current type filter
            currentTypeFilter = type;

            // Apply all filters
            applyFilters();
        }
    </script>
    <footer>
        <p>&copy; 2020 Raldamain Studios. Todos los derechos reservados.</p>
    </footer>
</body>
</html>
