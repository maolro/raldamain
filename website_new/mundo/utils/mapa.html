<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa del mundo | Raldamain</title>
<meta name="description" content="El mapa político de Raldamain: provincias, países, culturas, religiones y regiones. Pincha una provincia o un país para ver su información.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/mapa.css?v=20261114">
</head>
<body>
<header id="topbar">
  <div class="brand"><a class="back" href="/mundo" title="Volver a El Mundo"><span class="crest">⚜</span> Raldamain</a></div>
  <div class="search">
    <input id="search" list="search-list" placeholder="Buscar provincia o país…" autocomplete="off">
    <datalist id="search-list"></datalist>
  </div>
  <div class="tools">
    <button id="btn-ledger" class="fbtn" title="Libro de países (L)">📜 Países</button>
    <div id="brush-box" class="brush" hidden>
      <button id="btn-brush" class="fbtn" title="Pincel: asigna a un país las provincias que pinches o arrastres (B). Espacio + arrastrar: mover el mapa">🖌 Pincel</button>
      <select id="brush-country" title="País del pincel"></select>
    </div>
    <span id="save-state" class="save ok" hidden></span>
  </div>
</header>

<main id="stage">
  <canvas id="map"></canvas>
  <div id="tooltip" hidden></div>

  <aside id="prov-panel" class="panel left" hidden></aside>
  <aside id="country-panel" class="panel right" hidden></aside>

  <div id="mapmodes" class="frame">
    <div class="mm-title" id="mm-title">Político</div>
    <div class="mm-grid" id="mm-grid"></div>
  </div>
  <div id="legend" class="frame" hidden></div>
  <div id="zoom" class="frame">
    <button data-z="1.4" title="Acercar">＋</button>
    <button data-z="0.7" title="Alejar">－</button>
    <button data-z="fit" title="Ver todo">⤢</button>
  </div>
</main>

<div id="ledger" class="modal" hidden>
  <div class="modal-box frame">
    <div class="modal-head">
      <h2>Libro de Países</h2>
      <button class="fbtn" id="ledger-new">＋ Nuevo país</button>
      <button class="x" data-close>✕</button>
    </div>
    <div class="ledger-scroll"><table id="ledger-table"></table></div>
  </div>
</div>

<datalist id="dl-culture"></datalist>
<datalist id="dl-religion"></datalist>
<datalist id="dl-region"></datalist>
<datalist id="dl-terrain"></datalist>
<datalist id="dl-climate"></datalist>
<datalist id="dl-good"></datalist>
<datalist id="dl-building"></datalist>
<datalist id="dl-government"></datalist>
<datalist id="dl-rank"></datalist>

<script>window.MAPA_RO = true;</script>
<script src="/assets/js/mapa/app.js?v=20261114"></script>
</body>
</html>
