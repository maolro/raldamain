<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creador de Personajes | Raldamain</title>

    <!-- Site base styles -->
    <link rel="stylesheet" href="./assets/css/style.css?v=20261008">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">

    <!-- Bootstrap 4.6 (builder dependency) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css"
        integrity="sha384-B0vP5xmATw1+K9KRQjQERJvTumQW0nPEzvF6L/Z6nronJ3oUOFUFpCjEUQouq2+l" crossorigin="anonymous">

    <!-- Builder styles (load AFTER Bootstrap to override) -->
    <link rel="stylesheet" href="./assets/css/builder_style.css?v=20261008">
    <link rel="stylesheet" href="./assets/css/builder_overrides.css?v=20261008">
    <link rel="stylesheet" href="./assets/css/statblock.css?v=20261008">

    <!-- JS dependencies -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"
        integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-Piv4xVNRyMGpqkS2by6br4gNJ7DXjqk09RmUpJ8jgGtD7zP9yug3goQfGII0yAns" crossorigin="anonymous">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>

    <!-- Navbar component -->
    <script src="./assets/js/components.js?v=20261008"></script>

    <!-- Vue components -->
    <script src="./assets/js/builder/v-minusplusfield.js?v=20261008" type="text/javascript"></script>
    <script src="./assets/js/builder/v-rank-selecter.js?v=20261008" type="text/javascript"></script>
    <script src="./assets/js/builder/v-select-search.js?v=20261008" type="text/javascript"></script>
    <script src="./assets/js/builder/v-rankpage.js?v=20261008" type="text/javascript"></script>
    <script src="./assets/js/builder/v-talpage.js?v=20261008" type="text/javascript"></script>
    <script src="./assets/js/builder/v-spellpage.js?v=20261008" type="text/javascript"></script>
    <script src="./assets/js/builder/v-statpage.js?v=20261008" type="text/javascript"></script>
    <script src="./assets/js/builder/v-statblock.js?v=20261008" type="text/javascript"></script>
    <!--
    <script src="./assets/js/builder/v-archpage.js?v=20261008" type="text/javascript"></script>
    --->
    <script src="./assets/js/builder/v-equipage.js?v=20261008" type="text/javascript"></script>
</head>

<body>
    <!-- Shared site navbar -->
    <div id="navbar-container"></div>

    <!-- Hero banner -->
    <header class="builder-hero">
        <div class="hero-content">
            <h1>Creador de Personajes</h1>
        </div>
    </header>

    <!-- Vue App -->
    <section class="builder-container" id="app">
        <!-- TOP: Horizontal tab navigation -->
        <nav class="builder-tabs">
            <ul class="step-nav nav" role="tablist">
                <li class="nav-item">
                    <a class="step-nav-item nav-link active" data-toggle="tab" href="#stats" role="tab">Estadísticas</a>
                </li>
                <li class="nav-item">
                    <a class="step-nav-item nav-link" data-toggle="tab" href="#talents" role="tab">Talentos</a>
                </li>
                <li class="nav-item">
                    <a class="step-nav-item nav-link" data-toggle="tab" href="#ranks" role="tab">Rangos</a>
                </li>
                <li class="nav-item">
                    <a class="step-nav-item nav-link" data-toggle="tab" href="#spells" role="tab">Hechizos</a>
                </li>
                <li class="nav-item">
                    <a class="step-nav-item nav-link" data-toggle="tab" href="#gear" role="tab">Equipamiento</a>
                </li>
                <!--
                <li class="nav-item">
                    <a class="step-nav-item nav-link" data-toggle="tab" href="#archetypes" role="tab">Arquetipos</a>
                </li>
                -->
            </ul>
            <div class="builder-actions-inline">
                <button @click="downloadCharacterInfo">Descargar</button>
                <button @click="loadCharacterFromFile">Cargar</button>
                <button @click="resetCharacter" title="Borra la ficha y empieza un personaje nuevo">Nueva ficha</button>
                <button v-if="tallerMode" @click="saveFicha" class="taller-save"
                    :title="fichaId ? 'Guarda en data/statblocks/' + fichaId + '.json' : 'Guarda la ficha en data/statblocks'">{{ fichaLabel }}</button>
                <a v-if="tallerMode" href="/taller" class="taller-link" title="Volver a las fichas del Taller">📚 Fichas</a>
            </div>
        </nav>

        <!-- Two-column content -->
        <div class="builder-layout">
            <!-- LEFT: Form area -->
            <main class="builder-form">
                <div class="tab-content" id="mainTabContent">
                    <div class="tab-pane fade show active" id="stats" role="tabpanel">
                        <v-statpage :key="'v-statpage-' + formKey" v-bind:level="level" :stats="stats" :races="races" :arclevels="arclevels"
                            :charactername="charactername" @set-race="race = $event"
                            @set-level="level = $event" @set-name="charactername = $event"></v-statpage>
                    </div>
                    <div class="tab-pane fade" id="talents" role="tabpanel">
                        <v-talpage :key="'v-talpage-' + formKey" v-bind:level="level" :talents="talents" :psatb="myatb.passive"></v-talpage>
                    </div>
                    <div class="tab-pane fade" id="ranks" role="tabpanel">
                        <v-rankpage :key="'v-rankpage-' + formKey" v-bind:ranks="ranks" :level="level" :rkpoints="rkpoints"></v-rankpage>
                    </div>
                    <div class="tab-pane fade" id="spells" role="tabpanel">
                        <v-spellpage :key="'v-spellpage-' + formKey"></v-spellpage>
                    </div>
                    <div class="tab-pane fade" id="gear" role="tabpanel">
                        <v-equipage :key="'v-equipage-' + formKey" v-bind:equipment="equipment" :eqlist="eqList" :bagslots="equipment['bag']">
                        </v-equipage>
                    </div>
                    <div class="tab-pane fade" id="archetypes" role="tabpanel">
                        <h3 class="section-header">Arquetipos</h3>
                        <p style="color: var(--text-muted); font-style: italic;">Próximamente — esta sección se integrará en una futura actualización.</p>
                    </div>
                </div>
            </main>

            <!-- RIGHT: Character preview -->
            <aside class="builder-preview">
                <v-statblock class="text-justify">
                    <div class="text-center mt-3 sb-actions">
                        <button class="sb-copy-btn" @click="copyStatBlock">{{ copyLabel }}</button>
                        <a class="sb-copy-btn" href="/mesa.html?load=creador" target="_blank" rel="noopener">🎲 Mesa de Pruebas</a>
                    </div>
                </v-statblock>
            </aside>
        </div>
    </section>

    <footer>
        <p>&copy; 2020 Raldamain Studios. Todos los derechos reservados.</p>
    </footer>

    <!-- Builder main.js (must be last) -->
    <script src="./assets/js/richtext.js?v=20261008"></script>
    <script src="./assets/js/builder/main.js?v=20261008"></script>
</body>

</html>
