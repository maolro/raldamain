abilities:
  - id: parada
    name: Parada
    is_defense: true
    tags: [mental]
    roll: "5"
    notes: >
      ASSUMED. builds/bardo.md lists no Parada or Esquiva at all, which would
      leave the Bardo undefendable. Set to CAR (4) + Rank (1) = +5, matching
      how the Mago (INT) and Clérigo (SAB) derive theirs at this level.
      Worth confirming against the source statblock.

  - id: distraccion_ilusoria
    name: Distracción Ilusoria
    cost: {actions: 1, chi: 1}
    area: radio_pequeno
    reach: media
    tags: [spell, mental, illusion]
    effects:
      - kind: save
        save: men
        dc: "5"
        on_fail: [{kind: apply_effect, effect: desconcertado, duration: 1}]
    notes: >
      The area option: radio pequeño against Asalto Psíquico's single target.
      The rules also allow it as a Reaction, which the engine cannot offer yet.
      The "repeat the save if something breaks the distraction" clause is not
      modelled.

  - id: asalto_psiquico
    name: Asalto Psíquico
    cost: {actions: 1, chi: 1}
    reach: media
    tags: [spell, mental]
    effects:
      - kind: save
        save: men
        dc: "5"
        on_fail:
          - {kind: apply_effect, effect: desconcertado, duration: 1}
          - {kind: damage, damage: "1d6+2", dtype: psiquico}

  - id: voz_del_comandante
    name: Voz del Comandante
    cost: {uses_per_combat: 3, chi_when_exhausted: 1}
    bonus_action: true
    targeting: ally
    reach: media
    effects:
      - {kind: grant_advantage, to: target}

  - id: crear_ilusion
    name: Crear Ilusión
    cost: {actions: 1}
    implemented: false
    notes: Illusions need a fiction layer the sim does not have.

  - id: leer_pensamientos
    name: Leer Pensamientos
    cost: {actions: 1}
    implemented: false
    notes: Out-of-combat information gathering.

  - id: imagen_fantasmal
    name: Imagen Fantasmal
    cost: {reactions: 1, chi: 1}
