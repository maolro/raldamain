# Character build specs -- the INPUT to tools/build_gen.py.
#
# A build is just (level, stats, ranks, weapons).  Everything else --
# abilities, umbrales, saves, attack modifiers, chi -- is derived, so this
# file is the only place a character has to be edited.  Regenerate with:
#
#     python -m tools.build_gen --write-all --level 5
#
# Stats are the printed arrays from builds/*.md.  They obey the creation rule
# (base array 3,2,2,2,1,1 = 11 points, max 4 at creation) plus +1 per level,
# capped at TIER+3 -- validate with engine/stat_progression.py.
#
# Saves are derived, not stored: FIS = FUE+DES, VOL = CON+CAR, MEN = INT+SAB,
# which reproduces the printed save line on 9 of the 10 niv-5 builds exactly
# (Bárbaro's printed FÍS +7 is one higher than its own stats allow -- treated
# as a typo in builds/barbaro.md rather than replicated).
#
# `weapons` carry explicit dice because the sim's weapon table (2-action melee
# = 3 dice, 1-action = 2 dice, bow = 3 dice to pay for not being able to Parry)
# deliberately differs from the printed builds, which show base dice with the
# Ira/buff die already folded in.  `stat` is the stat backing damage -- an
# Infusión Elemental/Luminosa caster swings off their casting stat.

barbaro_5:
  name: Bárbaro (niv 5)
  source: builds/barbaro.md
  level: 5
  faith: "primigenio"
  stats: {FUE: 5, DES: 1, CON: 4, INT: 1, SAB: 2, CAR: 1}
  ranks: {estilo_coloso: 2, ira: 2, fortitud: 1, ascendencia_primigenia: 1}
  umbral_bonus: {general: 2, fisico: 6}   # armadura pesada
  preferred_row: front
  defense: parada
  defense_name: Parada
  defense_tags: [physical]
  weapons:
    - {id: gran_hacha, name: Gran Hacha, actions: 2, dtype: cortante, stat: FUE}
    - {id: lanza, name: Lanza, actions: 1, dtype: perforante, stat: FUE, reach: media}

