# monsters/sectarios.md -- the Secta Abisal cult roster (minion -> boss ladder).
#
# Dice-budget methodology (resolved this session): contested rolls (attack,
# defense, ability-DCs) settle on flat_mod + 1d6 at every tier from esbirro_elite
# up through boss -- the same "PC's real ceiling is +1d6, +2d6 is only reached by
# double-stacking a resource" principle already applied to aventureros.yaml's
# minibosses and to campeon_abisal.  The source doc's native drafts ran hotter
# (elite minions at +2d6, level-8 minibosses at +3d6/+2d6); those have been
# softened by 1-2 dice below to match.  Chuul keeps ONE +2d6 "signature" 2-action
# AoE pair (Lanzarrocas/Gran Barrido), mirroring trasgo_comando's Ataque Furtivo --
# tier differentiation comes from chassis size (impactos/actions/reactions), not
# from dice, so a single elevated finisher is flavour, not a balance lever.
#
# A handful of narrative riders have no engine equivalent yet (armour breaking,
# "damage that cannot be healed", Confusion/Ralentizado status ladders, mind
# control, flight-only clauses, condition-targeted redirects). Each is marked
# with a `notes:` line explaining what was dropped, rather than inventing new
# mechanics on the fly -- consistent with how the rest of this codebase flags
# assumed/unimplemented content.

  - id: acolito_secta
    name: Acólito de la Secta
    source: monsters/sectarios.md
    level: 2
    faith: abisal
    role: esbirro
    impactos: 2
    umbrales: {general: 4, fisico: 12}
    saves: {fis: "5", vol: "5+1d6", men: "5"}
    initiative: "5"
    preferred_row: front
    actions: 1
    reactions: 0
    defense: esquiva
    # Inmune: Mentales -- reusing the same condition list abisales.yaml already
    # uses for that exact tag.
    immunities: [miedo_1, miedo_2, miedo_3, miedo_4, desconcertado, desconcertado_2, desconcertado_3, maldito]
    abilities:
      - {id: esquiva, name: Esquiva, is_defense: true, tags: [physical], roll: "5+1d6"}
      - id: daga
        name: Daga
        cost: {actions: 1}
        tags: [weapon, physical]
        effects:
          - kind: attack
            attack_roll: "5+1d6"
            on_hit:
              - {kind: damage, damage: "1d6+4", dtype: perforante}
              - {kind: damage, damage: "1d6", dtype: necrotico}
      - id: asalto_psiquico
        name: Asalto Psíquico
        cost: {actions: 1}
        reach: media
        tags: [mental]
        effects:
          - {kind: save, save: men, dc: "5", on_fail: [{kind: apply_effect, effect: desconcertado, duration: 1}]}
      - id: rayo_energia_negativa
        name: Rayo de Energía Negativa
        cost: {actions: 1}
        reach: media
        tags: [spell, magic]
        notes: "El daño no puede sanarse -- no modelado, se aplica como daño normal."
        effects:
          - kind: attack
            attack_roll: "5+1d6"
            on_hit: [{kind: damage, damage: "1d6+4", dtype: necrotico}]

