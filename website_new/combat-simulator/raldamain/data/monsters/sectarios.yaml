  - id: asesino_sacro
    name: Asesino Sacro
    source: monsters/sectarios.md
    level: 8
    faith: abisal
    role: miniboss
    archetype: striker
    impactos: 6
    # Striker archetype (see tools/enemy_from_build.py): Estilo Asesino III +
    # Reflejos II read as a precision/evasion build, not a tank -- trading
    # umbral for a flat +2 on attack/defense only (save DCs untouched, since
    # those are about presence/willpower, not agility). Numbers cross-checked
    # against a from-scratch draft generated by that tool from this exact
    # rank list (estilo_asesino:3, guerrero_divino:3, reflejos:2, rastrear:1);
    # the tool's independent derivation landed on the same +2/-3 split.
    # A same-tier tank (Gólem de Carne) keeps the higher umbral/flat roll this
    # replaces; if you want the full tank<->striker contrast, soften its roll
    # by the same amount this raises Asesino Sacro's.
    umbrales: {general: 2, fisico: 7, magico: 10}
    saves: {fis: "9+1d6", vol: "9+1d6", men: "9+1d6"}
    initiative: "9"
    preferred_row: front
    actions: 3
    reactions: 2
    defense: esquiva
    immunities: [infortunio, maldito]   # Inmune: Repetir Tiros
    abilities:
      - {id: esquiva, name: Esquiva, is_defense: true, tags: [physical], roll: "11+1d6"}
      - id: cuchilla
        name: Cuchilla
        cost: {actions: 1}
        reach: media
        tags: [weapon, physical]
        effects:
          - kind: attack
            attack_roll: "11+1d6"
            on_hit:
              - {kind: damage, damage: "2d8+6", dtype: cortante}
              - {kind: damage, damage: "2d8", dtype: necrotico}
      - id: drenar_vida
        name: Drenar Vida
        cost: {actions: 1}
        targeting: enemy
        notes: "El daño no puede sanarse -- no modelado, se aplica como daño normal."
        effects:
          - kind: save
            save: vol
            dc: "9+1d6"
            on_fail:
              - {kind: damage, damage: "2d8+6", dtype: necrotico}
              - {kind: heal, amount: 1, to: self}
      - id: paso_del_asesino
        name: Paso del Asesino
        cost: {actions: 2}
        reach: adyacente
        tags: [weapon, physical]
        notes: "Movimiento sin provocar aperturas no modelado (el simulador es posicional-nulo para el movimiento)."
        effects:
          - kind: attack
            attack_roll: "11+1d6"
            on_hit:
              - {kind: damage, damage: "4d8+6", dtype: cortante}
              - {kind: damage, damage: "2d8", dtype: necrotico}
              - {kind: apply_effect, effect: herido_1, to: target}
              - {kind: apply_effect, effect: desventaja_defensiva, duration: 2, to: target}
      - id: golpe_mortal
        name: Golpe Mortal
        cost: {actions: 2}
        reach: adyacente
        tags: [weapon, physical]
        notes: "Maldición de estadística específica no modelada; se aplica Maldición de Mala Suerte (reroll_worst) como aproximación general."
        effects:
          - kind: attack
            attack_roll: "11+1d6"
            on_hit:
              - {kind: damage, damage: "3d8+6", dtype: fuerza}
              - {kind: damage, damage: "2d8", dtype: necrotico}
              - kind: save
                save: vol
                dc: "9+1d6"
                on_fail: [{kind: apply_effect, effect: maldito, to: target}]
      - id: consagrar_la_tierra
        name: Consagrar la Tierra (Abisal)
        cost: {actions: 2, chi: 0}
        targeting: self
        tags: [divine]
        notes: >
          The cult's own consecration -- the mirror of the Clérigo's, and the
          reason terrain control matters: a Celestial caster has to break this
          back to neutral before claiming the ground for their own god.
        effects:
          - {kind: consecrate, dc: "9+1d6"}
          - {kind: self_buff, effect: consagrando}
      - id: sugestion
        name: Sugestión
        cost: {actions: 1}
        reach: media
        tags: [mental]
        notes: "Forzar una acción específica no se modela (bot-controlado); se aplica solo la Desventaja defensiva."
        effects:
          - {kind: save, save: men, dc: "9+1d6", on_fail: [{kind: apply_effect, effect: desventaja_defensiva, duration: 2, to: target}]}
      - id: provocar_terror
        name: Provocar Terror
        cost: {actions: 2}
        area: radio_medio
        tags: [mental]
        notes: "Curar Miedo/Confusión a todos los aliados no modelado (sin objetivo party-wide en el motor); solo se aplica el efecto sobre los enemigos."
        effects:
          - {kind: save, save: vol, dc: "9+1d6", on_fail: [{kind: apply_effect, effect: miedo_2, duration: 2}]}
      - id: evasion
        name: Evasión
        cost: {reactions: 1}
        is_reaction: true
        trigger: on_defend
        targeting: self
        effects: [{kind: note, text: "+10 a Esquiva", defense_bonus: 10}]
      - id: aura_de_proteccion
        name: Aura de Protección
        cost: {reactions: 1}
        is_reaction: true
        trigger: on_save_fail
        targeting: self
        notes: "RAW limita el bono a tiros contra hechizos; aproximado como cualquier tiro de salvación, igual que Aura Protectora en otros statblocks."
        effects: [{kind: note, text: "+10 a un tiro de salvación", save_bonus: 10}]
      - id: toque_sanador
        name: Toque Sanador
        cost: {reactions: 1}
        is_reaction: true
        trigger: on_damaged
        targeting: self
        effects: [{kind: heal, amount: 1, to: self}, {kind: cleanse, to: self}]

