        effects:
          - kind: attack
            attack_roll: "1d6+7"
            on_hit: [{kind: damage, damage: "3d6+5", dtype: cortante}]
      - id: maza
        name: Maza
        cost: {actions: 2}
        area: radio_corto
        tags: [weapon, physical]
        effects:
          - kind: attack
            attack_roll: "1d6+7"
            on_hit:
              - {kind: damage, damage: "4d6+5", dtype: contundente}
              - kind: save
                save: fis
                dc: "7"
                on_fail: [{kind: apply_effect, effect: desventaja_defensiva}]
      - id: disparo_letal
        name: Disparo Letal
        cost: {actions: 2}
        reach: media
        tags: [weapon, physical]
        effects:
          - kind: attack
            attack_roll: "1d6+7"
            on_hit:
              - {kind: damage, damage: "4d6+5", dtype: perforante}
              - {kind: apply_effect, effect: herido_1}
      - id: furia_asesina
        name: Furia Asesina
        cost: {actions: 3}
        tags: [weapon, physical]
        effects:
          - kind: attack
            attack_roll: "2d6+7"
            on_hit: [{kind: damage, damage: "3d6+1d6+5", dtype: cortante}]
          - kind: attack
            attack_roll: "2d6+7"
            on_hit: [{kind: damage, damage: "3d6+1d6+5", dtype: cortante}]
        notes: >
          Modelled as the two-Hacha option.  The Desventaja on its own defensive
          rolls is not applied -- this overstates Furia Asesina slightly.
      - id: mirada_terrorifica
        name: Mirada Terrorífica
        cost: {actions: 1}
        area: radio_medio
        tags: [mental]
        effects:
          - kind: save
            save: vol
            dc: "7+1d6"
            on_fail: [{kind: apply_effect, effect: miedo_1, duration: 2}]
      - id: segundo_aliento
        name: Segundo Aliento
        cost: {reactions: 1}
        is_reaction: true
        trigger: on_damaged
        targeting: self
        effects: [{kind: umbral_boost, amount: 4, duration: 1, to: self, tags: [consume_on_umbral]}]
      - id: acechar
        name: Acechar
        cost: {reactions: 1}
        is_reaction: true
        implemented: false
        notes: Stealth needs cover/concealment state.
      - id: reposicion_forzosa
        name: Reposición Forzosa
        cost: {reactions: 1}
        is_reaction: true
        implemented: false
        notes: Needs an "enemy dodged successfully" trigger.
