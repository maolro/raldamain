# ============================================================================
# Level-5 PC builds, converted to chi-less Miniboss NPCs.
#
# Methodology (see the balance discussion in sim/README.md for the source
# reasoning):
#   - Chassis: 6 impactos, 3 actions, 2 reactions per round (base-info.md's
#     Miniboss template), no chi at all.
#   - Umbrales pinned to the 4/8/12 menu (level-5 tier): general stays at
#     the 4-floor; fisico/magico get 4 (undefended), 8 (moderate) or 12
#     (specialised) depending on which axis the class's own ranks actually
#     invest in -- Tank archetypes go high on both, Striker low on both,
#     Spellcaster/Supporter high magico + low fisico.
#   - Attack and defence rolls get the class's signature sustained
#     self-buff (Ira, Guerrero de la Fe, Canalizacion Celestial, Mente
#     Desencadenada, Forma de la Bestia) permanently folded in as "+1d6" --
#     the real ceiling a level-5 PC reaches by spending an action on it, per
#     this session's dice-baseline finding. The buff-activation ability
#     itself is dropped as redundant, EXCEPT recast as "Segunda Marcha": a
#     free, no-chi second gear that stacks one more Ventaja die on top
#     (scope: all, so it also lifts saves), for a solo miniboss that wants
#     a mid-fight escalation.
#   - Damage dice: a chi-less build can't toggle Ataque Furtivo/Rayo
#     Potenciado/etc. per swing, so their expected value is folded in as a
#     flat rate instead -- a "normal" 1-action attack gets +1 die (one
#     assumed chi-rider), a "powerful" 2-action attack gets +2 dice (two
#     stacked riders). This is why powerful attacks cost 2 actions in the
#     first place: the per-round action pool (3) is what rate-limits them
#     to at most once a round, the same job chi used to do.
#   - Upgrades that only added damage dice are folded into that rate.
#     Upgrades with a distinct effect (a push, a status, an extra target)
#     are split out into their own standalone action instead of dropped.
#   - Saves are left exactly as printed in the source PC build (no buff
#     baked in) -- Segunda Marcha's scope:"all" already lifts them when a
#     miniboss chooses to pop it, so the baseline stays honest to a
#     "before actively surging" state.
#   - Where a class's kit doesn't naturally support the recommended 6
#     actions / 4 reactions, the count is left short rather than padding
#     with invented, un-grounded content -- a generic "Reflejo de Combate"
#     (+10 defensive) reaction is the only filler used, and only to round
#     out an otherwise-thin reaction list.

  - id: barbaro_mercenario
    name: Bárbaro Mercenario
    source: builds/barbaro.md (niv 5, converted to Miniboss -- see notes above)
    level: 5
    role: miniboss
    impactos: 6
    umbrales: {general: 4, fisico: 12, magico: 4}
    saves: {fis: "7", vol: "5", men: "3"}
    initiative: "1"
    preferred_row: front
    actions: 3
    reactions: 2
    defense: parada
    immunities: [herido_1, herido_2]
    abilities:
      - {id: parada, name: Parada, is_defense: true, tags: [physical], roll: "7"}
      - id: gran_hacha
        name: Gran Hacha
        cost: {actions: 2}
        area: radio_pequeno
        tags: [weapon, physical]
      # Golpe Desestabilizador (Estilo Coloso I) and Reposicion Forzosa
      # (Estilo Coloso II) are chi-cost riders on the real PC's swing, not
      # separate attacks -- folded permanently into this one instead of
      # split into a cheaper standalone action, which was steering the bot
      # into spamming a weaker "normal" attack for the same rider value.
        effects:
          - kind: attack
            attack_roll: "7+1d6"
            on_hit:
              - {kind: damage, damage: "5d6+5", dtype: cortante}
              - {kind: save, save: fis, dc: "7+1d6", on_fail: [{kind: apply_effect, effect: desventaja_defensiva}]}
            on_miss:
              - {kind: save, save: fis, dc: "7+1d6", on_fail: [{kind: apply_effect, effect: desventaja_defensiva}]}
      - id: lanza
        name: Lanza
        cost: {actions: 1}
        reach: media
        tags: [weapon, physical]
        effects:
          - kind: attack
            attack_roll: "7+1d6"
            on_hit: [{kind: damage, damage: "3d6+5", dtype: perforante}]
      - id: lanzamiento
        name: Lanzamiento
        cost: {actions: 2}
        reach: media
        tags: [weapon, physical]
        notes: "Estilo Coloso II: lanza su arma a distancia media con el mismo peso que un golpe cuerpo a cuerpo."
        effects:
          - kind: attack
            attack_roll: "7+1d6"
            on_hit: [{kind: damage, damage: "5d6+5", dtype: cortante}]
      - id: demostracion_terrorifica
        name: Demostración Terrorífica
        cost: {actions: 1}
        area: radio_medio
        reach: media
        tags: [mental]
        effects:
          - {kind: save, save: vol, dc: "7+1d6", on_fail: [{kind: apply_effect, effect: miedo_1, duration: 2}]}
      - {id: segunda_marcha, name: Segunda Marcha, cost: {actions: 1}, targeting: self, effects: [{kind: self_buff, effect: segunda_marcha}]}
      - {id: segundo_aliento, name: Segundo Aliento, cost: {reactions: 1}, is_reaction: true, trigger: on_damaged, targeting: self, effects: [{kind: umbral_boost, amount: 4, duration: 1, to: self, tags: [consume_on_umbral]}]}
      - {id: proteger_aliado, name: Proteger Aliado, cost: {reactions: 1}, is_reaction: true, trigger: on_ally_attacked, effects: [kind: intercept]}
      - {id: reflejo_de_combate, name: Reflejo de Combate, cost: {reactions: 1}, is_reaction: true, trigger: on_defend, targeting: self, effects: [{kind: note, text: "+10 defensivo", defense_bonus: 10}]}

