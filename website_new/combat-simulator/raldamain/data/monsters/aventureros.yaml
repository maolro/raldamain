# monsters/aventureros.md -- rival adventurers, all niv 5 Minibosses.
#
# These are the closest thing in the bestiary to "a party fights a party", so
# they are the fairest test of whether the Miniboss role is tuned: they use the
# same shapes the PCs do rather than monster-only tricks.

