# monsters/abisales.md
#
# Note the shared identity: every abisal below Campeón is **Inmune a Mentales y
# Miedo**, which turns off a large slice of the party's control kit -- the
# Bárbaro's Demostración Terrorífica, the Bardo's whole rank, Halo Luminoso's
# rider.  That is the defining tactical fact about this faction.

  - id: engendro_abisal
    name: Engendro Abisal
    source: monsters/abisales.md
    level: 2
    faith: abisal
    role: esbirro_elite
    impactos: 2
    umbrales: {general: 4, fisico: 8, magico: 8, radiante: 4}
    saves: {fis: "5+1d6", vol: "5", men: "2"}
    initiative: "2"
    preferred_row: front
    actions: 2
    reactions: 1
    defense: parada
    immunities:
      - miedo_1
      - miedo_2
      - miedo_3
      - miedo_4
      - desconcertado
      - desconcertado_2
      - desconcertado_3
      - maldito
    abilities:
      - {id: parada, name: Parada, is_defense: true, tags: [physical], roll: "5"}
      - id: mordisco
        name: Mordisco
        cost: {actions: 1}
        tags: [natural, physical]
        effects:
          - kind: attack
            attack_roll: "5+1d6"
            on_hit:
              - {kind: damage, damage: "1d6+4", dtype: perforante}
              - kind: save
                save: vol
                dc: "5"
                on_fail: [{kind: apply_effect, effect: enfermado_1, duration: 3}]
      - id: garra
        name: Garra
        cost: {actions: 1}
        tags: [natural, physical]
        effects:
          - kind: attack
            attack_roll: "5+1d6"
            on_hit: [{kind: damage, damage: "1d6+4", dtype: cortante}]
        notes: The Agarra option is not modelled (no grapple state).
      - id: hacha
        name: Hacha
        cost: {actions: 2}
        tags: [weapon, physical]
        effects:
          - kind: attack
            attack_roll: "5+1d6"
            on_hit:
              - {kind: damage, damage: "2d6+4", dtype: cortante}
              - kind: save
                save: fis
                dc: "5+1d6"
                on_fail: [{kind: apply_effect, effect: desventaja_defensiva}]
      - id: grito_terrorifico
        name: Grito Terrorífico
        cost: {actions: 1}
        area: radio_medio
        reach: media
        tags: [mental]
        effects:
          - kind: save
            save: vol
            dc: "5+1d6"
            on_fail: [{kind: apply_effect, effect: miedo_1, duration: 2}]
      - id: proteger_aliado
        name: Proteger Aliado
        cost: {reactions: 1}
        is_reaction: true
        trigger: on_ally_attacked
        effects: [kind: intercept]
      - id: segundo_aliento
        name: Segundo Aliento
        cost: {reactions: 1}
        is_reaction: true
        trigger: on_damaged
        targeting: self
        effects: [{kind: umbral_boost, amount: 4, duration: 1, to: self, tags: [consume_on_umbral]}]

  - id: fanatico_abisal
    name: Fanático Abisal
    source: monsters/abisales.md
    level: 5
    faith: abisal
    role: miniboss
    impactos: 6
  # Tierra Consagrada's Ventaja is already folded into the printed pools.
    umbrales: {general: 4, fisico: 8, magico: 8, radiante: 4}
    saves: {fis: "4", vol: "7+1d6", men: "7+1d6"}
    initiative: "4"
    preferred_row: back
    actions: 3
    reactions: 2
    defense: esquiva
    immunities: [miedo_1, miedo_2, miedo_3, miedo_4, desconcertado, desconcertado_2, desconcertado_3, maldito]
    abilities:
      - {id: esquiva, name: Esquiva, is_defense: true, roll: "1d6+7"}
      - id: escupitajo_toxico
        name: Escupitajo Tóxico
        cost: {actions: 1}
        reach: media
        tags: [spell, mental]
        effects:
          - kind: attack
            attack_roll: "1d6+7"
            on_hit: [{kind: damage, damage: "1d6+5", dtype: acido}]
      - id: miasma_abisal
        name: Miasma Abisal
        cost: {actions: 2}
        area: cono_pequeno
        reach: media
        tags: [spell, mental]
        effects:
          - kind: attack
            attack_roll: "1d6+7"
            on_hit:
              - {kind: damage, damage: "2d6+5", dtype: acido}
              - kind: save
                save: vol
                dc: "7+1d6"
                on_fail: [{kind: apply_effect, effect: enfermado_1, duration: 3}]
      - id: maldicion
        name: Maldición
        cost: {actions: 1}
        reach: media
        tags: [spell, mental]
        effects:
          - kind: save
            save: vol
            dc: "7+1d6"
            on_fail: [{kind: apply_effect, effect: maldito, duration: combat}]
      - id: consagrar_la_tierra
        name: Consagrar la Tierra (Abisal)
        cost: {actions: 2}
        targeting: self
        tags: [divine]
        notes: "El equivalente abisal de la consagración -- ver sectarios.yaml/asesino_sacro."
        effects:
          - {kind: consecrate, dc: "7+1d6"}
          - {kind: self_buff, effect: consagrando}
      - id: distraccion_ilusoria
        name: Distracción Ilusoria
        cost: {actions: 1}
        area: radio_corto
        reach: media
        tags: [spell, mental, illusion]
        effects:
          - kind: save
            save: vol
            dc: "7+1d6"
            on_fail: [{kind: apply_effect, effect: desconcertado, duration: 1}]
      - id: invocacion_abisal
        name: Invocación Abisal
        cost: {actions: 2}
        targeting: self
        effects:
          - {kind: summon, statblock: engendro_abisal, amount: 1}
      - id: salto_espacial
        name: Salto Espacial
        cost: {reactions: 1}
        is_reaction: true
        trigger: on_defend
        targeting: self
        effects:
          - {kind: note, text: "+10 a Esquiva y un paso", defense_bonus: 10}
      - id: infortunio
        name: Infortunio
        cost: {reactions: 1}
        is_reaction: true
        is_reroll: true
        reroll_scope: enemy
        reroll_kinds: [attack, defense, save]
      - id: crear_ilusion
        name: Crear Ilusión
        cost: {actions: 1}
        implemented: false
        notes: Illusions need a fiction layer the sim does not have.
      - id: invisibilidad
        name: Invisibilidad
        cost: {reactions: 1}
        is_reaction: true
        implemented: false
        notes: Needs a concealment/targeting state the sim does not track.

  - id: guerrero_abisal
