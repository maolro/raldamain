magia_protectora:
  name: Magia Protectora
  source: ranks/arcanos.md
  ranks:
    1:
      abilities:
        - id: armadura_arcana
          name: Armadura Arcana
          cost: {actions: 1, chi: 1}
          targeting: ally
          reach: toque
          tags: [spell]
          effects:
            # Physical AND magical thresholds, permanent for the fight, and
            # castable on an ally -- `duration: combat` is what makes it stick.
            # Named effect id so re-casting refreshes rather than stacks
            # (add_effect dedupes by id) -- "Este hechizo no es acumulable".
            - {kind: umbral_boost, effect: armadura_arcana, name: Armadura Arcana,
               amount: "{{RANGO*2}}", duration: combat, to: target,
               dtypes: [fisico, magico]}
          text: "Toque, aumenta los umbrales Físico y Mágico del objetivo por Rango x 2 durante el resto del combate. No es acumulable consigo mismo."
      notes: >
        Contrahechizo (contrarrestar un hechizo en vuelo) y Disrupción Arcana
        (deshabilitar un objeto mágico) necesitan interrupciones dirigidas a
        efectos concretos que el motor no expone.
    2:
      abilities: []
      notes: "ranks/arcanos.md no define todavía un Rango II para Magia Protectora."

