              to: self
              name: Muro de Energía
              protects_allies: true
              retaliate: {save: fis, dc: "{{MOD}}", damage: "1d{{DIE}}+{{CAR}}", dtype: fuego}
          text: "Crea un muro que absorbe Rango x 3 puntos de daño; los atacantes cuerpo a cuerpo fallan salvación Físico o sufren 1d6 + CAR daño Fuego."
        - id: metamagia
          name: Metamagia
