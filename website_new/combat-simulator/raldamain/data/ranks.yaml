        - id: barrera_electrica
          name: Barrera Eléctrica
          cost: {reactions: 1, chi: 1}
          is_reaction: true
          trigger: on_damaged
          targeting: self
          effects:
            - kind: wall
              amount: "{{RANGO*3}}"
              duration: 3
              to: self
              name: Barrera Eléctrica
              protects_allies: true
              retaliate: {save: fis, dc: "{{MOD}}", damage: "1d{{DIE}}+{{CAR}}", dtype: electrico}
          text: "Crea un muro que absorbe Rango x 3 puntos de daño; los atacantes cuerpo a cuerpo fallan Físico o sufren 1d6 + CAR daño Eléctrico."

# ========================================================== ocultismos.md

magia_vida:
  name: Magia Vida
  source: ranks/ocultismos.md
  ranks:
    1:
      abilities:
        - id: rayo_luminoso
          name: Rayo Luminoso
          cost: {actions: 1}
          reach: media
          tags: [spell, divine, mental]
          effects:
            - kind: attack
              attack_roll: "{{MOD}}"
              on_hit: [{kind: damage, damage: "1d{{DIE}}+{{max(SAB,CAR)}}", dtype: radiante}]
          upgrades:
            - {id: rayo_potenciado, name: Rayo Potenciado, cost: {chi: 1}, damage_dice: 1}
          text: "Distancia media, 1d6 + SAB/CAR daño Radiante. (1 chi) Añade un dado de daño adicional."
        - {id: toque_sanador, name: Toque Sanador, cost: {actions: 1, chi: 1},
           targeting: ally, reach: toque, tags: [divine, heal],
           effects: [{kind: heal, amount: 1, to: target}],
           text: "Toque, cura un impacto a un aliado adyacente."}
        - id: halo_luminoso
          name: Halo Luminoso
          cost: {actions: 1, chi: 1}
          area: radio_corto
          tags: [spell, divine, mental]
          effects:
            - kind: save
              save: vol
              dc: "{{MOD}}"
              on_fail:
                - {kind: damage, damage: "1d{{DIE}}+{{max(SAB,CAR)}}", dtype: radiante}
                - {kind: apply_effect, effect: cegado, duration: 1}
          text: "Radio corto, los objetivos fallan Voluntad o sufren 1d6 + SAB/CAR daño Radiante y quedan Cegados una ronda."
    2:
      abilities:
        - id: muro_luminoso
          name: Muro Luminoso
          cost: {reactions: 1, chi: 1}
          is_reaction: true
          trigger: on_damaged
          targeting: self
          effects:
            - {kind: umbral_boost, amount: "{{RANGO*2}}", duration: 1, to: self,
               tags: [consume_on_umbral]}
            - kind: wall
              amount: 0
              duration: 1
              to: self
              name: Muro Luminoso
              retaliate: {save: vol, dc: "{{MOD}}", damage: "1d{{DIE}}+{{max(SAB,CAR)}}",
                          dtype: radiante, effect: cegado, effect_duration: 1}
          text: "Aumenta todos tus umbrales por Rango x 2; los atacantes cuerpo a cuerpo fallan Voluntad o sufren 1d6 + SAB/CAR Radiante y quedan Cegados."
      notes: "Vínculo Vital (compartir impactos con un aliado) necesita un enlace entre combatientes que el motor no modela."

nigromancia:
  name: Nigromancia
  source: ranks/ocultismos.md
  ranks:
    1:
      passives:
        - {target: umbral, key: necrotico, amount: "{{RANGO+1}}",
           text: "Aspecto de No-Muerto: Resistencia igual a tu Rango + 1 al daño Necrótico."}
        - {target: umbral, key: frio, amount: "{{RANGO+1}}",
           text: "Aspecto de No-Muerto: Resistencia igual a tu Rango + 1 al daño Frío."}
      abilities:
        - id: rayo_energia_negativa
          name: Rayo de Energía Negativa
          cost: {actions: 1}
          reach: media
          tags: [spell, mental]
          effects:
            - kind: attack
              attack_roll: "{{MOD}}"
              on_hit: [{kind: damage, damage: "1d{{DIE}}+{{max(INT,CAR)}}", dtype: necrotico}]
          upgrades:
            - {id: rayo_negativo_potenciado, name: Rayo Potenciado, cost: {chi: 1}, damage_dice: 1}
          text: "Distancia media, 1d6 + INT/CAR daño Necrótico que no puede curarse (la prohibición de curación no está modelada)."
        - id: drenar_vida
          name: Drenar Vida
          cost: {actions: 1, chi: 1}
          reach: adyacente
          tags: [spell, mental]
          effects:
            - kind: save
              save: vol
              dc: "{{MOD}}"
              on_fail:
                - {kind: damage, damage: "1d{{DIE}}+{{max(INT,CAR)}}", dtype: necrotico}
                - {kind: heal, amount: 1, to: self}
          text: "Adyacente, el objetivo falla Voluntad o sufre 1d6 + INT/CAR daño Necrótico; si le provocas un impacto te curas uno."
    2:
      abilities:
        - id: animar_no_muerto
          name: Animar No-Muerto
          cost: {actions: 2, chi: 1}
          targeting: self
          effects:
            - {kind: summon, statblock: acolito_secta, amount: 1}
          text: "Distancia media, anima un cadáver como un Zombi o Esqueleto de nivel 2. Se usa acolito_secta como stand-in de nivel 2 hasta que existan statblocks de no-muertos."
      notes: "Vínculo Parasítico (transferir impactos recibidos) necesita un enlace entre combatientes que el motor no modela."

