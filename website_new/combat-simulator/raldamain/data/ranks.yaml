          upgrades:
            - {id: rayo_potenciado, name: Rayo Potenciado, cost: {chi: 1}, damage_dice: 1}
          text: "Distancia media, 1d6 + INT daño Fuerza. (1 chi) Añade un dado de daño adicional."
