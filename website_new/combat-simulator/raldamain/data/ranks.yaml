# Structured rank-ability library -- the machine-readable twin of ranks/*.md.
#
# Schema per rank tree:
#   <rank_id>:
#     name: <display name>
#     source: ranks/<file>.md
#     ranks:
#       <level>:
#         passives: [ {target: umbral|save|stat|defense|immunity, key, amount} ]
#         abilities: [ <ability dict, same DSL as character YAML abilities> ]
#
# "passives" are folded into the character's baked umbral/save/stat numbers ONCE
# at build time (they are not toggled -- Resistencia Natural is always on).
# "abilities" become real entries in the character's abilities list.
#
# An ability with `rider: true` is an attack UPGRADE (a chi-cost technique
# bolted onto a weapon/spell attack: Golpe Desestabilizador, Ataque Furtivo),
# not a standalone action.  sim/tools/build_gen.py attaches those to every
# eligible attack instead of emitting them as top-level abilities.
#
# Formula convention (see engine/rank_formula.py); every {{...}} token is
# resolved per-character at assembly time:
#   RANGO  the character's level in THIS rank tree
#   MOD    the level-derived contested-roll modifier (3 + 2*TIER: +5 at niv 2,
#          +7 at niv 5, +9 at niv 8 ...) -- shared by attack rolls, defence
#          rolls and save DCs on every build, verified against builds/*.md
#   DIE    damage die size for this rank (d6 at I-II, d8 at III-IV, d10 at V+)
#   TIER   ceil(level/3);  NIVEL  the character's level
#   FUE/DES/CON/INT/SAB/CAR  the character's stats
#   {{max(SAB,CAR)}} renders the "SAB/CAR" either-stat text in the source.
#
# Coverage: ALL 24 rank trees in ranks/, Rango I-II (enough to build any
# character up to niv 5-6).  Rango III+ is deliberately out of scope until
# level 8+ builds are being generated -- add it the same way.

# =========================================================== combate.md

fortitud:
  name: Fortitud
  source: ranks/combate.md
  ranks:
    1:
      passives:
        - {target: umbral, key: general, amount: "{{RANGO+1}}",
           text: "Resistencia Natural: aumenta todos sus umbrales por un valor igual a su Rango + 1."}
      abilities:
        - id: segundo_aliento
          name: Segundo Aliento
          cost: {reactions: 1, chi: 1}
          is_reaction: true
          trigger: on_damaged
          targeting: self
          effects:
            - {kind: umbral_boost, amount: "{{RANGO+2}}", duration: 1, to: self,
               tags: [consume_on_umbral]}
          text: "Aumenta sus umbrales por Rango + 2 contra el siguiente ataque o reduce un efecto de estado por un paso."
        - id: segundo_aliento_estado
          name: Segundo Aliento
          cost: {reactions: 1, chi: 1}
          is_reaction: true
          trigger: on_condition
          targeting: self
          effects:
            - {kind: reduce_condition, to: self}
          text: "La otra opción de Segundo Aliento: justo al sufrir un efecto de estado, lo reduce un paso (Herido II pasa a Herido I; uno sin niveles desaparece)."
    2:
      passives:
        - {target: save, key: vol, amount: "advantage:1",
           text: "Difícil de Matar: Ventaja en tiros de salvación de Voluntad."}
        - {target: umbral, key: necrotico, amount: "{{RANGO+2}}",
           text: "Constitución Férrea: Resistencia igual a tu Rango + 2 al daño Necrótico."}
        - {target: umbral, key: veneno, amount: "{{RANGO+2}}",
           text: "Constitución Férrea: Resistencia igual a tu Rango + 2 al daño Veneno."}
      notes: >
        Difícil de Matar's "keeps acting at 0 impactos" half is not modelled
        (the engine drops a combatant at 0); only its Voluntad advantage is.

ira:
  name: Ira
  source: ranks/combate.md
  ranks:
    1:
      abilities:
        - {id: ira, name: Ira, cost: {actions: 1}, targeting: self,
           effects: [{kind: self_buff, effect: ira, duration: 6}],
           text: "Ventaja en tiros físicos (ataque, defensa, habilidad, salvación) y +1 dado de daño base durante 6 rondas."}
        - id: demostracion_terrorifica
          name: Demostración Terrorífica
          cost: {actions: 1, chi: 1}
          area: radio_medio
          reach: media
          tags: [mental]
          effects:
            - {kind: save, save: vol, dc: "{{MOD}}",
               on_fail: [{kind: apply_effect, effect: miedo_1, duration: 2}]}
          text: "Todos los enemigos en un radio medio fallan salvación de Voluntad o sufren Miedo I."
    2:
      passives:
        - {target: immunity, key: herido_1,
           text: "Resistencia Salvaje: ignoras Herido I mientras estés en Ira (modelado como inmunidad permanente)."}
        - {target: immunity, key: herido_2,
           text: "Resistencia Salvaje: ignoras Herido II mientras estés en Ira."}
      abilities:
        - {id: ira, name: Ira, cost: {actions: 1}, targeting: self,
           effects: [{kind: self_buff, effect: ira_r2, duration: 6}],
           text: "Como Rango I, y mientras estés en Ira aumentas todos tus umbrales por un valor igual a tu Rango (Resistencia Salvaje) e ignoras Herido I y II."}
        - id: frenesi_de_batalla
          name: Frenesí de Batalla
          cost: {actions: 1}
          targeting: self
          effects:
            - {kind: self_buff, effect: frenesi_de_batalla, duration: 1}
          text: >
            Puede recibir Ventaja en todos sus tiros de ataque esta ronda a
            costa de Desventaja en todos sus tiros defensivos.
      notes: >
        Frenesí de Batalla is modelled (see conditions.yaml) but not wired
        into any scripted build's maintain list -- GreedyPolicy has no branch
        that prices "more damage" against "easier to hit", so a bot told to
        always take it would use it even when the defensive downside is
        dangerous. Probe it directly rather than through the standard sweep.

mente_desencadenada:
  name: Mente Desencadenada
  source: ranks/combate.md
  ranks:
    1:
      abilities:
        - {id: mente_desencadenada, name: Mente Desencadenada, cost: {actions: 1}, targeting: self,
           effects: [{kind: self_buff, effect: mente_desencadenada, duration: 6}],
           text: "Ventaja en tiros mentales (ataque, defensa, habilidad, salvación) y +1 dado de daño mágico durante 6 rondas."}
      notes: "Agilidad Mental (Rango + 2 niveles de talento) es progresión fuera de combate -- sin efecto simulable."
    2:
      abilities:
        - {id: mente_desencadenada, name: Mente Desencadenada, cost: {actions: 1}, targeting: self,
           effects: [{kind: self_buff, effect: mente_desencadenada_r2, duration: 6}],
           text: "Como Rango I, y mientras estés en Mente Desencadenada ignoras Herido I/II y aumentas tus umbrales por un valor igual a tu Rango (Poder del Dolor)."}
      notes: "Conocimiento Arcano (aprendes dos hechizos de Rango I) se resuelve en la build spec eligiendo un árbol mágico adicional."

presencia:
  name: Presencia
  source: ranks/combate.md
  ranks:
    1:
      abilities:
        - {id: voz_del_comandante, name: Voz del Comandante,
           cost: {uses_per_combat: "{{RANGO+2}}", chi_when_exhausted: 1}, bonus_action: true,
           targeting: ally, reach: media, effects: [{kind: grant_advantage, to: target}],
           text: "Un aliado a distancia media recibe Ventaja en su siguiente tiro. Rango + 2 usos por combate."}
      passives:
        - {target: save, key: vol, amount: "advantage:1",
           text: "Voluntad Poderosa: Ventaja en salvación de Voluntad."}
        - {target: save_substitute, key: men, from: vol,
           text: "Voluntad Poderosa: puedes cambiar tu tiro de salvación Mental por tu tiro de Presencia (CAR); modelado como MEN = max(MEN, VOL)."}
    2:
      abilities:
        - id: revigorar
          name: Revigorar
          cost: {actions: 1, chi: 1}
          targeting: ally
          reach: media
          effects:
            - {kind: heal, amount: 1, to: target}
            - {kind: cleanse, to: target}
          text: "Un aliado a distancia media recupera un impacto temporal y se cura de Miedo/Confusión/Desconcertado."
        - id: provocacion
          name: Provocación
          cost: {actions: 1, chi: 1}
          area: radio_medio
          reach: media
          tags: [mental]
          effects:
            - {kind: save, save: men, dc: "{{MOD}}",
               on_fail: [{kind: apply_effect, effect: provocado, duration: 1}]}
          text: "Todos los enemigos a distancia media fallan salvación Mental o deben atacarte y tienen Desventaja en su siguiente tiro defensivo."

rastrear:
  name: Rastrear
  source: ranks/combate.md
  ranks:
    1:
      abilities:
        - id: analizar_enemigo
          name: Analizar Enemigo
          cost: {actions: 1, chi: 1}
          targeting: enemy
          reach: media
          effects:
            - {kind: self_buff, effect: analizado, duration: combat, against_target: true}
          text: "Ventaja en ataque, defensa, habilidad y +1 dado de daño contra un enemigo específico hasta que caiga o acabe el combate."
        - id: siempre_preparado_pocion
          name: "Siempre Preparado (Poción de Sanación)"
          cost: {actions: 1, chi: 1}
          targeting: self
          tags: [heal]
          effects:
            - {kind: heal, amount: 1, to: self}
            - {kind: cleanse, to: self}
          text: "Obtienes de inmediato un objeto consumible de coste 1. Se modela la opción más usada (Poción de Sanación); build_gen puede emitir las variantes Bomba/Cadena/Bomba de Humo."
    2:
      abilities: []
      notes: >
        Acechar (invisibilidad) y Terreno Predilecto (ventaja en Percepción/
        Sigilo en un terreno) no tienen efecto de combate simulable -- el motor
        no modela ocultamiento ni terreno.

reflejos:
  name: Reflejos
  source: ranks/combate.md
  ranks:
    1:
      passives:
        - {target: save, key: fis, amount: "advantage:1",
           text: "Reflejos Superiores: Ventaja en tiros de salvación Físicos."}
        - {target: initiative, key: initiative, amount: "{{RANGO}}",
           text: "Reflejos Superiores: +Rango a tu tiro de Iniciativa."}
      abilities:
        - id: instinto_de_supervivencia
          name: Instinto de Supervivencia
          cost: {uses_per_combat: "{{RANGO+2}}", chi_when_exhausted: 1}
          is_reaction: true
          is_reroll: true
          reroll_scope: self
          reroll_kinds: [attack, defense]
          text: "Repite un tiro de Destreza (tratado como ataque/defensa propios) y te quedas con el que más te convenga. Rango + 2 usos por combate."
    2:
      abilities:
        - {id: evasion, name: Evasión, cost: {reactions: 1, chi: 1}, is_reaction: true,
           trigger: on_defend, targeting: self,
           effects: [{kind: note, text: "+10 a Esquiva", defense_bonus: 10}],
           text: "Suma +10 a un tiro de Esquiva y te mueves un paso sin provocar aperturas."}
      passives:
        - {target: umbral, key: general, amount: "{{RANGO+1}}",
           text: "Giro Defensivo: aumenta todos tus umbrales por un valor igual a tu Rango + 1."}

# =========================================================== marciales.md

estilo_coloso:
  name: Estilo Coloso
  source: ranks/marciales.md
  ranks:
    1:
      abilities:
        - id: golpe_desestabilizador
          name: Golpe Desestabilizador
          rider: true
          cost: {chi: 1}
          applies_on_parry: true
          on_hit:
            - {kind: save, save: fis, dc: "{{MOD}}",
               on_fail: [{kind: apply_effect, effect: desventaja_defensiva}]}
          text: "Rider de ataque cuerpo a cuerpo (1 chi): el objetivo falla salvación Físico o es empujado y sufre Desventaja en su siguiente tiro defensivo."
        - {id: ataque_poderoso, name: Ataque Poderoso, cost: {actions: 1}, targeting: self,
           effects: [{kind: self_buff, effect: ataque_poderoso}],
           text: "Tu siguiente ataque recibe un dado de daño adicional."}
        - {id: proteger_aliado, name: Proteger Aliado, cost: {reactions: 1},
           is_reaction: true, trigger: on_ally_attacked, effects: [{kind: intercept}],
           text: "Interceptas un ataque dirigido a un aliado, usando tu propio tiro defensivo."}
    2:
      abilities:
        - id: gran_barrido
          name: Gran Barrido
          rider: true
          cost: {chi: 2}
          damage_dice: 1
          area: radio_pequeno
          text: "Rider de ataque cuerpo a cuerpo: golpea a todos en un radio pequeño, +1 dado de daño, empuja al impactar. Cuesta 2 chi bajo la regla PA (área +1 PA, dado +1 PA)."
        - id: reposicion_forzosa
          name: Reposición Forzosa
          rider: true
          cost: {chi: 1}
          on_miss:
            - {kind: save, save: fis, dc: "{{MOD}}",
               on_fail: [{kind: apply_effect, effect: desventaja_defensiva}]}
          text: "Rider de ataque (1 chi): un enemigo que esquivó tu ataque falla salvación Físico o sufre Desventaja en su siguiente tiro defensivo."
        - id: lanzamiento
          name: Lanzamiento
          rider: true
          cost: {chi: 1}
          damage_dice: 1
          text: "Rider de ataque (1 chi): lanzas tu arma a distancia media, +1 dado de daño (el cambio de alcance no está modelado como campo aparte)."

estilo_duelista:
  name: Estilo Duelista
  source: ranks/marciales.md
  ranks:
    1:
      abilities:
        - {id: secuencia_de_ataques, name: Secuencia de Ataques, rider: true,
           cost: {chi: 1}, extra_attacks: 1,
           text: "Rider de ataque (1 chi): un segundo ataque contra el mismo objetivo como acción bonus, sin las mejoras del primero."}
        - id: truco_de_combate
          name: Truco de Combate
          cost: {actions: 1}
          tags: [physical]
          effects:
            - {kind: save, save: fis, dc: "{{MOD}}",
               on_fail: [{kind: apply_effect, effect: desventaja_defensiva}]}
          text: "Un objetivo al alcance de tu arma falla salvación (Físico/Voluntad/Mental) o sufre Desventaja en su siguiente tiro defensivo. Se modela solo la variante Físico."
        - id: truco_rapido
          name: Truco Rápido
          cost: {chi: 1}
          bonus_action: true
          tags: [physical]
          effects:
            - {kind: save, save: fis, dc: "{{MOD}}",
               on_fail: [{kind: apply_effect, effect: desventaja_defensiva}]}
          text: >
            Modo alternativo de Truco de Combate (1 chi en vez de 1 Acción):
            se usa como acción bonus ANTES de atacar. Es lo que hace la
            habilidad relevante -- pagada con una Acción compite con atacar y
            nunca sale a cuenta; pagada con chi prepara el ataque del mismo turno.
      passives:
        - {target: defense, key: skilled, amount: 1,
           text: "Defensa Hábil: al defenderte, tira dos métodos y quédate con el mejor."}
    2:
      abilities:
        - id: ataque_torbellino
          name: Ataque Torbellino
          rider: true
          cost: {chi: 1}
          damage_dice: 1
          area: radio_corto
          text: "Rider de ataque (1 chi): golpea a todos en un radio corto, +1 dado de daño; puedes moverte antes o después sin provocar aperturas."
        - id: atrapar_arma
          name: Atrapar Arma
          cost: {reactions: 1, chi: 1}
          is_reaction: true
          trigger: on_parry
          tags: [physical]
          effects:
            - kind: save
              save: fis
              dc: "{{MOD}}"
              on_fail:
                - {kind: apply_effect, effect: enredado, duration: 2, to: target}
                - {kind: apply_effect, effect: arma_atrapada, duration: 2, to: target}
          text: "Reacción (1 chi) cuando un enemigo detiene tu ataque con Parada o detienes con Parada el ataque de un arma enemiga: salvación Físico o queda Enredado y no puede atacar con su arma. El intento de desarmar (1 acción) no está modelado."
      notes: "Persecución (contraatacar a un enemigo que se mueve) necesita seguimiento de movimiento que el motor no tiene."

estilo_asesino:
  name: Estilo Asesino
  source: ranks/marciales.md
  ranks:
    1:
      abilities:
        - {id: apuntar_ataque, name: Apuntar Ataque, cost: {actions: 1}, targeting: self,
           effects: [{kind: self_buff, effect: apuntado}],
           text: "Recibe +2 (+4 a Rango III, +6 a Rango V) en tu siguiente tiro de ataque."}
        - id: ataque_furtivo
          name: Ataque Furtivo
          rider: true
          cost: {chi: 1}
          damage_dice: 1
          on_hit:
            - {kind: apply_effect, effect: herido_1, duration: 3}
          text: "Rider de ataque (1 chi): +1 dado de daño y provoca Herido I al impactar."
      notes: "Robo Rápido (robar un objeto al impactar) no tiene efecto de combate simulable."
    2:
      abilities:
        - id: ataque_triple
          name: Ataque Triple
          rider: true
          cost: {chi: 1}
          area: radio_corto
          text: "Rider de ataque (1 chi): golpea hasta tres objetivos con el mismo ataque, aplicando las mejoras a todos (aproximado con área)."
        - id: presionar_defensas
          name: Presionar Defensas
          rider: true
          cost: {chi: 1}
          on_hit:
            - {kind: save, save: men, dc: "{{MOD}}",
               on_fail: [{kind: apply_effect, effect: desventaja_defensiva}]}
          text: "Rider de ataque (1 chi): el objetivo falla salvación Mental o Desventaja en su tiro defensivo (RAW es antes de atacar; aproximado como rider on_hit)."
        - id: secuencia_punaladas
          name: Secuencia de Puñaladas
          rider: true
          cost: {chi: 1}
          extra_attacks: 1
          text: "Rider de ataque (1 chi): segundo ataque contra el mismo objetivo como acción bonus, sin sus mejoras."
    3:
      abilities:
        - id: salto_del_asesino
          name: Salto del Asesino
          rider: true
          cost: {chi: 2}
          damage_dice: 1
          on_hit:
            - {kind: apply_effect, effect: desventaja_defensiva}
          text: "Rider de ataque cuerpo a cuerpo (2 chi): +1 dado de daño; el objetivo tiene Desventaja defendiéndose."
        - id: golpe_penetrante
          name: Golpe Penetrante
          rider: true
          cost: {chi: 2}
          dtype: fuerza
          text: "Rider de ataque (2 chi): trata los umbrales del objetivo como si fuera daño Fuerza (bypassa grupo)."
      passives:
        - {target: attack, key: apuntado_bonus, amount: 4,
           text: "Apuntar Ataque sube a +4 a este Rango (era +2)."}
      notes: "Velocidad Extrema (Esquiva simultánea a otro método + paso gratis al esquivar) ya cubierto por skilled_defense; el paso gratis no se modela (posicional)."

# =========================================================== divinos.md

guerrero_divino:
  name: Guerrero Divino
  source: ranks/divinos.md
  ranks:
    1:
      abilities:
        - id: azote_divino
          name: Azote Divino
          rider: true
          divine_smite: true
          cost: {chi: 1}
          on_hit:
            - {kind: damage, damage: "{{RANGO}}d{{DIE}}", dtype: "{{DIVINE_DTYPE}}"}
          text: "Rider de ataque (1 chi): tu siguiente ataque provoca {{RANGO}}d{{DIE}} daño elemental adicional de un tipo asociado a tu dios, contado APARTE para umbrales."
          notes: >
            `divine_smite: true` tells build_gen to emit one sibling ATTACK per
            damage type the character's god allows (build spec's `divine_dtypes`)
            rather than a single rider -- the upgrade picker takes every
            affordable upgrade unconditionally, so a genuine choice between
            mutually exclusive dtypes has to live at the ability level.
            The separate on_hit `damage` entry is what makes it divide by its
            own umbral: resolver.py runs each on_hit damage node through its
            own _apply_damage call.
    2:
      abilities:
        - {id: guerrero_de_la_fe, name: Guerrero de la Fe, cost: {actions: 1}, targeting: self,
           effects: [{kind: self_buff, effect: guerrero_de_la_fe, duration: 6}],
           text: "Ventaja en ataque, defensa, magia divina y salvaciones de Voluntad/Mental durante 6 rondas."}
        - id: azote_castigador
          name: Azote Castigador
          rider: true
          cost: {chi: 1}
          on_hit:
            - {kind: save, save: vol, dc: "{{MOD}}",
               on_fail: [{kind: apply_effect, effect: maldito}]}
          text: "Rider de ataque (1 chi): al impactar, el objetivo falla salvación de Voluntad o queda maldito (aproximado con la condición genérica maldito)."
        - {id: milagro_menor, name: Milagro Menor,
           cost: {uses_per_combat: "{{RANGO+2}}", chi_when_exhausted: 1}, is_reaction: true,
           is_reroll: true, reroll_scope: any, reroll_kinds: [attack, defense, save],
           text: "Un aliado o enemigo repite un tiro y se queda con el resultado que más te convenga. Rango + 2 usos por combate."}
    3:
      abilities:
        - id: aura_protectora
          name: Aura Protectora
          cost: {reactions: 1, chi: 1}
          is_reaction: true
          trigger: on_save_fail
          targeting: self
          effects: [{kind: note, text: "+10 a un tiro de salvación", save_bonus: 10}]
          text: "Reacción (1 chi): al fallar una salvación, +10 al tiro (RAW la restringe a hechizos; aproximado como cualquier salvación, como en otros statblocks de este proyecto)."
        - id: presencia_divina
          name: Presencia Divina
          cost: {actions: 1, chi: 2}
          area: radio_medio
          reach: media
          tags: [divine, mental]
          effects:
            - {kind: save, save: vol, dc: "{{MOD}}",
               on_fail: [{kind: apply_effect, effect: miedo_2, duration: 2}]}
          text: >
            Tus aliados reducen Miedo/Confusión/Desconcertado por 1, tus
            enemigos fallan salvación de Voluntad o sufren Miedo II. La
            reducción de aliados no se modela: "to: allies" no es un objetivo
            real en el motor (solo "self" tiene manejo especial en
            _resolve_recipients; cualquier otro valor cae de vuelta a la
            lista de `targets` del ability, que para un área de enemigos sería
            -- incorrectamente -- los propios enemigos). Solo se modela el
            lado ofensivo hasta que exista un objetivo "todos los aliados".
      passives:
        - {target: umbral, key: magico, amount: "{{RANGO+1}}",
           text: "Aura Protectora (pasiva): Resistencia a Magia igual a tu Rango + 1."}
      notes: "Aprender 2 hechizos de Rango II del dios no es simulable genéricamente -- depende de qué dios."

magia_divina:
  name: Magia Divina
  source: ranks/divinos.md
  ranks:
    1:
      abilities:
        - {id: milagro_menor, name: Milagro Menor,
           cost: {uses_per_combat: "{{RANGO+2}}", chi_when_exhausted: 1}, is_reaction: true,
           is_reroll: true, reroll_scope: any, reroll_kinds: [attack, defense, save],
           text: "Un aliado o enemigo repite un tiro y se queda con el resultado que más te convenga. Rango + 2 usos por combate."}
    2:
      abilities:
        - id: consagrar_la_tierra
          name: Consagrar la Tierra
          cost: {actions: 2, chi: 1}
          targeting: self
          tags: [divine]
          effects:
            # `consecrate` walks the battlefield's faith track one step; the
            # buff itself is handed out by Resolver._sync_consecration to
            # everyone of the holding faith, so it is NOT a self_buff.
            - {kind: consecrate, dc: "{{MOD}}"}
            # Stay channelling: contest_consecration re-rolls every round
            # while the caster keeps focus.
            - {kind: self_buff, effect: consagrando}
          text: >
            El campo de batalla queda consagrado a tu dios, otorgando a TI y a
            todo adorador del mismo dios Ventaja en ataque, defensa y magia
            divina. Si otro dios ya lo tiene consagrado, hacéis tiros
            enfrentados y el éxito lo devuelve a neutral (reclamarlo cuesta un
            segundo éxito). Mientras mantengas la concentración repites el
            tiro cada ronda.
      notes: "Manifestación Divina (limpiar/maldecir a distancia, efecto elegido por el DJ) no modelada -- necesita una decisión de arbitraje."

